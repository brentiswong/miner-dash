<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ocean Miner Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --bg: #0d1117; --card: #161b22; --text: #c9d1d9; --accent: #58a6ff; --border: #30363d; --ok: #3fb950; --err: #f85149; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); color: var(--text); padding: 20px; }
        .container { max-width: 1000px; margin: auto; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 15px; margin-bottom: 25px; }
        .card { background: var(--card); border: 1px solid var(--border); padding: 20px; border-radius: 10px; }
        .value { font-size: 1.8rem; font-weight: bold; color: white; }
        .table-container { background: var(--card); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 12px; background: #1c2128; cursor: pointer; user-select: none; }
        th:hover { color: var(--accent); }
        td { padding: 12px; border-bottom: 1px solid var(--border); }
        .status { font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <div id="error-bar" style="color:var(--err); margin-bottom:15px; font-size:0.9rem;"></div>

    <div class="grid">
        <div class="card"><div>Total Hashrate</div><div class="value" id="t_hr">Loading...</div></div>
        <div class="card"><div>Unpaid Balance</div><div class="value" id="t_unpaid">Loading...</div></div>
        <div class="card"><div>Est. Next Payout</div><div class="value" id="t_est">Loading...</div></div>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th onclick="doSort('name')">Worker <span id="s0">↕</span></th>
                    <th onclick="doSort('h300')">5m <span id="s1">↕</span></th>
                    <th onclick="doSort('h10800')">3h <span id="s2">↕</span></th>
                    <th onclick="doSort('online')">Status <span id="s3">↕</span></th>
                </tr>
            </thead>
            <tbody id="w-body">
                <tr><td colspan="4" style="text-align:center; padding:40px;">Connecting to Ocean...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    // 1. GET WALLET (Injected by Netlify)
    const WALLET = window.WALLET_ADDRESS;
    
    // 2. PUBLIC PROXY (This is the FIX: It bypasses Netlify redirects entirely)
    const PROXY_URL = 'https://api.allorigins.win/raw?url=';
    const OCEAN_API = 'https://api.ocean.xyz/v1';

    let workers = [];
    let sortKey = 'h300';
    let sortAsc = false;

    async function update() {
        if (!WALLET) {
            document.getElementById('error-bar').innerText = "Error: Wallet not injected via Netlify Snippets.";
            return;
        }

        try {
            // Encode the URLs to pass them through the AllOrigins proxy
            const hrUrl = PROXY_URL + encodeURIComponent(`${OCEAN_API}/user_hashrate_full/${WALLET}`);
            const snUrl = PROXY_URL + encodeURIComponent(`${OCEAN_API}/statsnap/${WALLET}`);

            const [hrRes, snRes] = await Promise.all([ fetch(hrUrl), fetch(snUrl) ]);
            
            const hrData = await hrRes.json();
            const snData = await snRes.json();

            // UPDATE STATS
            const stats = snData.result || snData;
            document.getElementById('t_unpaid').innerText = (stats.unpaid || 0).toLocaleString() + ' sats';
            document.getElementById('t_est').innerText = (stats.estimated_payout_next_block || 0).toLocaleString() + ' sats';

            // PROCESS WORKERS
            const wObj = hrData.result?.workers || {};
            let totalHr = 0;
            workers = Object.keys(wObj).map(name => {
                const s = wObj[name][0];
                const h5m = (s.hashrate_300s || 0) / 1e12; // Convert to TH/s
                totalHr += h5m;
                return {
                    name: name,
                    h300: h5m,
                    h10800: (s.hashrate_10800s || 0) / 1e12,
                    online: h5m > 0
                };
            });

            document.getElementById('t_hr').innerText = totalHr.toFixed(2) + ' TH/s';
            document.getElementById('error-bar').innerText = ""; 
            render();
        } catch (e) {
            console.error(e);
            document.getElementById('error-bar').innerText = "Connection lost. Retrying in 5 minutes...";
        }
    }

    function doSort(key) {
        if (sortKey === key) sortAsc = !sortAsc;
        else { sortKey = key; sortAsc = false; }
        render();
    }

    function render() {
        const keys = ['name', 'h300', 'h10800', 'online'];
        keys.forEach((k, i) => {
            const el = document.getElementById('s' + i);
            if (el) el.innerText = (k === sortKey) ? (sortAsc ? '↑' : '↓') : '↕';
        });

        workers.sort((a, b) => {
            let vA = a[sortKey], vB = b[sortKey];
            if (typeof vA === 'string') return sortAsc ? vA.localeCompare(vB) : vB.localeCompare(vA);
            return sortAsc ? vA - vB : vB - vA;
        });

        document.getElementById('w-body').innerHTML = workers.map(w => `
            <tr>
                <td><b>${w.name}</b></td>
                <td>${w.h300.toFixed(2)} TH/s</td>
                <td>${w.h10800.toFixed(2)} TH/s</td>
                <td><span class="status" style="color:${w.online ? 'var(--ok)' : 'var(--err)'}">${w.online ? '● Online' : '○ Offline'}</span></td>
            </tr>
        `).join('');
    }

    update();
    setInterval(update, 300000); 
</script>
</body>
</html>
