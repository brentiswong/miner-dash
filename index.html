<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Private Ocean Miner Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --bg: #0d1117; --card: #161b22; --text: #c9d1d9; --accent: #58a6ff; --border: #30363d; --ok: #3fb950; --err: #f85149; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); color: var(--text); padding: 20px; }
        .container { max-width: 1200px; margin: auto; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 15px; margin-bottom: 25px; }
        .card { background: var(--card); border: 1px solid var(--border); padding: 20px; border-radius: 10px; }
        .value { font-size: 1.8rem; font-weight: bold; color: white; }
        .table-container { background: var(--card); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 12px; background: #1c2128; cursor: pointer; user-select: none; }
        th:hover { color: var(--accent); }
        td { padding: 12px; border-bottom: 1px solid var(--border); }
    </style>
</head>
<body>
<div class="container">
    <div id="auth-check" style="color:var(--err); margin-bottom:10px; font-size: 0.8rem;"></div>
    <div class="grid">
        <div class="card"><div>Total Hashrate</div><div class="value" id="t_hr">...</div></div>
        <div class="card"><div>Unpaid Balance</div><div class="value" id="t_unpaid">...</div></div>
        <div class="card"><div>Est. Next Payout</div><div class="value" id="t_est">...</div></div>
    </div>
    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th onclick="doSort('name')">Worker <span id="s0">↕</span></th>
                    <th onclick="doSort('h300')">5m <span id="s1">↕</span></th>
                    <th onclick="doSort('h10800')">3h <span id="s2">↕</span></th>
                    <th onclick="doSort('online')">Status <span id="s3">↕</span></th>
                </tr>
            </thead>
            <tbody id="w-body">
                <tr><td colspan="4" style="text-align:center; padding:30px;">Connecting to Ocean API via Proxy...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    // Injected by Netlify
    const WALLET = window.WALLET_ADDRESS;
    
    // BYPASS REDIRECTS: Using AllOrigins public proxy to solve the 404/CORS issues
    const PROXY_BASE = 'https://api.allorigins.win/raw?url=';
    const OCEAN_URL = 'https://api.ocean.xyz/v1';

    if (!WALLET) {
        document.getElementById('auth-check').innerText = "Security Error: Wallet not injected by Netlify.";
    }

    let workers = [];
    let sortKey = 'h300';
    let sortAsc = false;

    async function update() {
        if (!WALLET) return;
        try {
            // Constructing the full URL through the public proxy
            const hrUrl = PROXY_BASE + encodeURIComponent(`${OCEAN_URL}/user_hashrate_full/${WALLET}`);
            const snUrl = PROXY_BASE + encodeURIComponent(`${OCEAN_URL}/statsnap/${WALLET}`);

            const [hrRes, snRes] = await Promise.all([ fetch(hrUrl), fetch(snUrl) ]);

            const hrData = await hrRes.json();
            const snData = await snRes.json();

            const stats = snData.result || snData;
            document.getElementById('t_unpaid').innerText = (stats.unpaid || 0).toLocaleString() + ' sats';
            document.getElementById('t_est').innerText = (stats.estimated_payout_next_block || 0).toLocaleString() + ' sats';

            const wObj = hrData.result?.workers || {};
            let total = 0;
            workers = Object.keys(wObj).map(name => {
                const s = wObj[name][0];
                const h5m = (s.hashrate_300s || 0) / 1e12;
                total += h5m;
                return {
                    name, 
                    h300: h5m, 
                    h10800: (s.hashrate_10800s || 0) / 1e12,
                    online: h5m > 0
                };
            });

            document.getElementById('t_hr').innerText = total.toFixed(2) + ' TH/s';
            document.getElementById('auth-check').innerText = ""; // Clear errors
            render();
        } catch (e) { 
            console.error("Update failed", e); 
            document.getElementById('auth-check').innerText = "API Connection Error. Will retry in 5 mins.";
        }
    }

    function doSort(key) {
        if (sortKey === key) sortAsc = !sortAsc;
        else { sortKey = key; sortAsc = false; }
        render();
    }

    function render() {
        const keys = ['name', 'h300', 'h10800', 'online'];
        const idx = keys.indexOf(sortKey);
        
        // Update sorting arrows
        for(let i=0; i<4; i++) document.getElementById('s'+i).innerText = '↕';
        document.getElementById('s'+idx).innerText = sortAsc ? '↑' : '↓';

        workers.sort((a, b) => {
            let vA = a[sortKey], vB = b[sortKey];
            if (typeof vA === 'string') return sortAsc ? vA.localeCompare(vB) : vB.localeCompare(vA);
            return sortAsc ? vA - vB : vB - vA;
        });

        document.getElementById('w-body').innerHTML = workers.map(w => `
            <tr>
                <td><b>${w.name}</b></td>
                <td>${w.h300.toFixed(2)}</td>
                <td>${w.h10800.toFixed(2)}</td>
                <td><span style="color:${w.online ? 'var(--ok)':'var(--err)'}">${w.online?'● Online':'○ Offline'}</span></td>
            </tr>
        `).join('');
    }

    update();
    setInterval(update, 300000); // 5 minutes
</script>
</body>
</html>
