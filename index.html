<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NGU TECH - Mining Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --bg: #0d1117; --card: #161b22; --text: #c9d1d9; --accent: #58a6ff; --border: #30363d; --ok: #3fb950; --dead: #f85149; }
        body { font-family: -apple-system, system-ui, sans-serif; background: var(--bg); color: var(--text); padding: 15px; margin: 0; }
        .container { max-width: 1200px; margin: auto; }
        .pool-status { background: #1c2128; border: 1px solid var(--border); border-radius: 8px; padding: 12px 18px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; flex-wrap: wrap; gap: 10px; }
        .stat-item { display: flex; align-items: center; gap: 6px; }
        .pool-label { color: #8b949e; text-transform: uppercase; font-size: 0.65rem; font-weight: 700; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .card { background: var(--card); border: 1px solid var(--border); padding: 18px; border-radius: 8px; }
        .value { font-size: 1.5rem; font-weight: 800; color: white; margin-top: 5px; font-family: monospace; }
        .chart-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        @media (max-width: 900px) { .chart-grid { grid-template-columns: 1fr; } }
        .chart-box { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 15px; height: 350px; position: relative; }
        table { width: 100%; border-collapse: collapse; font-family: monospace; font-size: 0.85rem; background: var(--card); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; margin-top: 10px; }
        th { text-align: left; padding: 12px; background: #1c2128; color: #8b949e; font-size: 0.7rem; text-transform: uppercase; cursor: pointer; }
        th:hover { color: var(--accent); }
        td { padding: 12px; border-bottom: 1px solid var(--border); }
        .controls { position: absolute; top: 10px; right: 15px; z-index: 10; display: flex; gap: 5px; }
        .btn-sm { background: #30363d; color: white; border: none; padding: 4px 10px; border-radius: 4px; font-size: 0.65rem; cursor: pointer; }
        #status-bar { font-size: 0.7rem; color: var(--accent); margin-bottom: 10px; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <div id="status-bar">SYNCING DATA...</div>
    
    <div class="pool-status">
        <div class="stat-item"><span class="pool-label">Pool HR:</span> <span id="p-hr-global">...</span></div>
        <div class="stat-item"><span class="pool-label">Block:</span> <span id="p-height">...</span></div>
        <div class="stat-item"><span class="pool-label">Finder:</span> <span id="p-finder">...</span></div>
        <div id="p-time" style="color:var(--accent); font-weight:bold;">Syncing...</div>
    </div>

    <div class="grid">
        <div class="card"><div class="pool-label">User Hashrate (PH/s)</div><div id="t_hr" class="value">...</div></div>
        <div class="card"><div class="pool-label">Est Next Block</div><div id="t_est" class="value" style="color:var(--accent)">...</div></div>
        <div class="card"><div class="pool-label">Unpaid (BTC)</div><div id="t_unpaid" class="value" style="color:var(--ok)">...</div></div>
    </div>

    <div class="chart-grid">
        <div class="chart-box">
            <div class="controls">
                <button class="btn-sm" onclick="filterHist(30)">1M</button>
                <button class="btn-sm" onclick="filterHist(365)">1Y</button>
                <button class="btn-sm" onclick="filterHist(0)">ALL</button>
            </div>
            <h3 style="margin:0 0 10px 0; font-size:0.8rem">Historical Performance</h3>
            <canvas id="histChart"></canvas>
        </div>
        <div class="chart-box">
            <h3 style="margin:0 0 10px 0; font-size:0.8rem">Live 24H Activity</h3>
            <canvas id="liveChart"></canvas>
        </div>
    </div>

    <table>
        <thead>
            <tr>
                <th onclick="sortWorkers('name')">Worker</th>
                <th onclick="sortWorkers('h5m')">5m (TH)</th>
                <th onclick="sortWorkers('h3h')">3h (TH)</th>
                <th onclick="sortWorkers('h24h')">24h (TH)</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody id="worker-table"></tbody>
    </table>
</div>

<script>
    const WALLET = "bc1q76zgkz5ussy2hl54vdz7nv0q96kta82ckdu7ys";
    const PROXY = 'https://api.allorigins.win/raw?url=';
    let histChart, liveChart, fullHistData = [], workerData = [];

    function setText(id, text) {
        const el = document.getElementById(id);
        if (el) el.innerText = text;
    }

    async function init() {
        initCharts();
        await loadHistory();
        updateLive();
        setInterval(updateLive, 60000);
    }

    async function loadHistory() {
        try {
            const res = await fetch('history.json');
            const data = await res.json();
            fullHistData = data.result.report
                .filter(d => parseFloat(d.hashrate_avg_24hr_thsec) > 0)
                .sort((a,b) => new Date(a.date) - new Date(b.date));
            filterHist(0);
            setText('status-bar', "READY");
        } catch (e) { setText('status-bar', "LIVE ONLY"); }
    }

    async function updateLive() {
        try {
            const [hrRes, uRes, pRes, phRes] = await Promise.all([
                fetch(PROXY + encodeURIComponent(`https://api.ocean.xyz/v1/user_hashrate_full/${WALLET}`)),
                fetch(PROXY + encodeURIComponent(`https://api.ocean.xyz/v1/statsnap/${WALLET}`)),
                fetch(PROXY + encodeURIComponent(`https://api.ocean.xyz/v1/latest_block`)),
                fetch(PROXY + encodeURIComponent(`https://api.ocean.xyz/v1/pool_hashrate`))
            ]);
            
            const hr = await hrRes.json();
            const u = await uRes.json();
            const p = await pRes.json();
            const ph = await phRes.json();

            // Totals
            setText('t_hr', (parseFloat(hr.result?.total_300s || 0)/1e15).toFixed(2));
            setText('t_unpaid', parseFloat(u.result?.unpaid || 0).toFixed(8));
            setText('t_est', parseFloat(u.result?.estimated_earn_next_block || 0).toFixed(8));
            setText('p-hr-global', (parseFloat(ph.result?.pool_300s || 0)/1e18).toFixed(2) + " EH/s");

            // Block Timing (iPad Safe)
            const block = p.result?.blocks[0] || {};
            setText('p-height', "#" + (block.height || "---"));
            setText('p-finder', block.username ? (block.username.substring(0,8)) : "---");

            if (block.ts) {
                const baseTs = block.ts.split('.')[0].replace('T', ' '); 
                const blockTime = new Date(baseTs + " UTC").getTime();
                const diff = Math.floor((Date.now() - blockTime) / 1000);
                if (diff < 0 || isNaN(diff)) setText('p-time', "Just now");
                else if (diff < 3600) setText('p-time', Math.floor(diff/60) + "m ago");
                else setText('p-time', Math.floor(diff/3600) + "h ago");
            }

            // Live Chart
            const label = new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
            liveChart.data.labels.push(label);
            liveChart.data.datasets[0].data.push((parseFloat(hr.result?.total_300s || 0)/1e15).toFixed(2));
            if(liveChart.data.labels.length > 20) { liveChart.data.labels.shift(); liveChart.data.datasets[0].data.shift(); }
            liveChart.update();

            // Process Workers for Sorting
            const ws = hr.result?.workers || {};
            workerData = Object.keys(ws).map(name => ({
                name: name,
                h5m: ws[name][0].hashrate_300s / 1e12,
                h3h: ws[name][0].hashrate_10800s / 1e12,
                h24h: ws[name][0].hashrate_86400s / 1e12
            }));
            renderWorkers();
            
        } catch(e) { console.error(e); }
    }

    function renderWorkers() {
        document.getElementById('worker-table').innerHTML = workerData.map(w => `
            <tr>
                <td><b>${w.name}</b></td>
                <td>${w.h5m.toFixed(1)}</td>
                <td>${w.h3h.toFixed(1)}</td>
                <td>${w.h24h.toFixed(1)}</td>
                <td style="color:${w.h5m > 0 ? 'var(--ok)':'var(--dead)'}">●</td>
            </tr>`).join('');
    }

    function sortWorkers(key) {
        workerData.sort((a, b) => b[key] > a[key] ? 1 : -1);
        renderWorkers();
    }

    function filterHist(days) {
        if (!fullHistData.length) return;
        const filtered = days === 0 ? fullHistData : fullHistData.slice(-days);
        histChart.data.labels = filtered.map(d => d.date);
        histChart.data.datasets[0].data = filtered.map(d => (parseFloat(d.hashrate_avg_24hr_thsec)/1000).toFixed(2));
        histChart.update();
    }

    function initCharts() {
        histChart = new Chart(document.getElementById('histChart'), { type: 'line', data: { labels: [], datasets: [{ label: 'PH/s', data: [], borderColor: '#58a6ff', fill: true, backgroundColor: 'rgba(88,166,255,0.05)', pointRadius: 0 }] }, options: { responsive: true, maintainAspectRatio: false } });
        liveChart = new Chart(document.getElementById('liveChart'), { type: 'line', data: { labels: [], datasets: [{ label: 'PH/s', data: [], borderColor: '#ff7b72', tension: 0.4 }] }, options: { responsive: true, maintainAspectRatio: false } });
    }

    init();
</script>
</body>
</html>
