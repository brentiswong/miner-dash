<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NGU TECH - High-Performance Mining</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --bg: #0d1117; --card: #161b22; --text: #c9d1d9; --accent: #58a6ff; --border: #30363d; --ok: #3fb950; --warn: #f85149; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); color: var(--text); padding: 20px; margin: 0; }
        .container { max-width: 1200px; margin: auto; }
        #auth-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); display: flex; align-items: center; justify-content: center; z-index: 1000; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .card { background: var(--card); border: 1px solid var(--border); padding: 18px; border-radius: 8px; }
        .label { font-size: 0.65rem; color: #8b949e; text-transform: uppercase; font-weight: 700; letter-spacing: 1px; }
        .value { font-size: 1.5rem; font-weight: 800; color: white; margin-top: 5px; }
        .sub-value { font-size: 0.8rem; margin-top: 4px; opacity: 0.8; font-weight: 500; }
        .table-container { background: var(--card); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; margin-top: 20px; }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 12px; background: #1c2128; color: #8b949e; font-size: 0.7rem; text-transform: uppercase; cursor: pointer; transition: 0.2s; }
        th:hover { color: var(--accent); background: #21262d; }
        td { padding: 12px; border-bottom: 1px solid var(--border); font-family: 'SFMono-Regular', Consolas, monospace; font-size: 0.85rem; }
        .chart-box { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 15px; margin-bottom: 20px; height: 280px; }
        input { width: 300px; padding: 10px; background: #0d1117; border: 1px solid var(--border); color: white; border-radius: 4px; }
        button { background: var(--accent); color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

<div id="auth-overlay"><div style="text-align:center"><h2>NGU TECH Dashboard</h2><input type="text" id="wallet-input" placeholder="BTC Wallet Address"><br><br><button onclick="login()">Sync Dashboard</button></div></div>

<div class="container">
    <div class="grid">
        <div class="card">
            <div class="label">Total Hashrate</div>
            <div id="t_hr" class="value">0.00 PH/s</div>
            <div id="t_miners" class="sub-value" style="color:var(--accent)">0 Active Miners</div>
        </div>
        <div class="card">
            <div class="label">Pool Luck (TIDES)</div>
            <div id="t_luck" class="value">--%</div>
            <div id="t_blocks" class="sub-value" style="color:#d29922">Scanning blocks...</div>
        </div>
        <div class="card">
            <div class="label">Unpaid (Sats)</div>
            <div id="t_unpaid" class="value">0</div>
            <div id="t_usd" class="sub-value" style="color:var(--ok)">$0.00 USD</div>
        </div>
        <div class="card">
            <div class="label">Next Reward Est.</div>
            <div id="t_est" class="value">0.0000 BTC</div>
            <div id="t_shares" class="sub-value">0.00G Shares</div>
        </div>
    </div>

    <div class="chart-box"><canvas id="hashrateChart"></canvas></div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th onclick="setSort('name')">Miner Name ↕</th>
                    <th onclick="setSort('h5')">5m (TH/s) ↕</th>
                    <th onclick="setSort('h3')">3h (TH/s) ↕</th>
                    <th onclick="setSort('h24')">24h (TH/s) ↕</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="worker-table"></tbody>
        </table>
    </div>
</div>

<script>
    let WALLET = localStorage.getItem('ocean_wallet');
    const PROXY = 'https://api.allorigins.win/raw?url=';
    let chart;
    let currentSort = { key: 'name', asc: true };
    let lastData = [];

    function login() { const v = document.getElementById('wallet-input').value.trim(); if(v) { localStorage.setItem('ocean_wallet', v); location.reload(); } }

    function setSort(key) {
        if (currentSort.key === key) currentSort.asc = !currentSort.asc;
        else { currentSort.key = key; currentSort.asc = true; }
        renderTable();
    }

    function renderTable() {
        const sorted = [...lastData].sort((a, b) => {
            let valA = a[currentSort.key], valB = b[currentSort.key];
            return currentSort.asc ? (valA > valB ? 1 : -1) : (valA < valB ? 1 : -1);
        });
        
        document.getElementById('worker-table').innerHTML = sorted.map(m => `
            <tr>
                <td><b>${m.name}</b></td>
                <td>${m.h5.toFixed(2)}</td>
                <td>${m.h3.toFixed(2)}</td>
                <td>${m.h24.toFixed(2)}</td>
                <td style="color:var(--ok); font-weight:bold;">● ACTIVE</td>
            </tr>
        `).join('');
    }

    async function update() {
        if (!WALLET) return;
        document.getElementById('auth-overlay').style.display = 'none';

        try {
            const priceRes = await fetch("https://api.coinbase.com/v2/prices/BTC-USD/spot");
            const price = parseFloat((await priceRes.json()).data.amount);

            // Using full hashrate endpoint to ensure all workers are captured
            const [hrRes, userRes, poolRes] = await Promise.all([
                fetch(PROXY + encodeURIComponent(`https://api.ocean.xyz/v1/user_hashrate_full/${WALLET}`)),
                fetch(PROXY + encodeURIComponent(`https://api.ocean.xyz/v1/statsnap/${WALLET}`)),
                fetch(PROXY + encodeURIComponent(`https://api.ocean.xyz/v1/poolstats`))
            ]);

            const hrData = await hrRes.json();
            const userData = await userRes.json();
            const poolData = await poolRes.json();
            const u = userData.result || userData;

            // 1. All Miners Data
            const workers = hrData.result?.workers || hrData.workers || {};
            let totalH = 0;
            lastData = Object.keys(workers).map(name => {
                const s = Array.isArray(workers[name]) ? workers[name][0] : workers[name];
                const h5 = parseFloat(s.hashrate_300s || 0);
                totalH += h5;
                return { 
                    name, 
                    h5: h5/1e12, 
                    h3: parseFloat(s.hashrate_10800s||0)/1e12, 
                    h24: parseFloat(s.hashrate_86400s||0)/1e12 
                };
            });
            renderTable();

            // 2. Summary Headers
            const totalPH = (totalH / 1e15).toFixed(2);
            document.getElementById('t_hr').innerText = totalPH + " PH/s";
            document.getElementById('t_miners').innerText = lastData.length + " Active Miners";

            // 3. Robust Luck Detection (Looking inside result or root)
            const blocks = poolData.pool_blocks_found_window || poolData.result?.pool_blocks_found_window || 0;
            const luck = ((blocks / 8) * 100).toFixed(0);
            document.getElementById('t_luck').innerText = luck + "%";
            document.getElementById('t_blocks').innerText = blocks + " Blocks in current window";

            // 4. Financials
            const unpaid = parseFloat(u.unpaid || 0);
            document.getElementById('t_unpaid').innerText = Math.floor(unpaid * 100000000).toLocaleString();
            document.getElementById('t_usd').innerText = "$" + (unpaid * price).toLocaleString(undefined, {minimumFractionDigits:2});
            document.getElementById('t_est').innerText = parseFloat(u.estimated_earn_next_block || 0).toFixed(6) + " BTC";
            document.getElementById('t_shares').innerText = (parseFloat(u.shares_in_tides || 0) / 1e9).toFixed(2) + "G Shares";

            // 5. Hashrate Timeline
            const now = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            chart.data.labels.push(now);
            chart.data.datasets[0].data.push(totalPH);
            if (chart.data.labels.length > 25) { chart.data.labels.shift(); chart.data.datasets[0].data.shift(); }
            chart.update();

        } catch (e) { console.error("Sync Error", e); }
    }

    function initChart() {
        const ctx = document.getElementById('hashrateChart').getContext('2d');
        chart = new Chart(ctx, {
            type: 'line',
            data: { labels: [], datasets: [{ label: 'PH/s', data: [], borderColor: '#58a6ff', tension: 0.4, fill: true, backgroundColor: 'rgba(88,166,255,0.05)', pointRadius: 0, borderWidth: 2 }] },
            options: { responsive: true, maintainAspectRatio: false, scales: { y: { grid: { color: '#30363d' } }, x: { grid: { display: false } } }, plugins: { legend: { display: false } } }
        });
    }

    if (WALLET) { initChart(); update(); setInterval(update, 60000); }
</script>
</body>
</html>
