<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NGU TECH - Ocean Monitor</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --bg: #0d1117; --card: #161b22; --text: #c9d1d9; --accent: #58a6ff; --border: #30363d; --ok: #3fb950; --dead: #f85149; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); padding: 15px; margin: 0; }
        .container { max-width: 1200px; margin: auto; }
        #auth-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); display: flex; align-items: center; justify-content: center; z-index: 1000; }
        .pool-status { background: #1c2128; border: 1px solid var(--border); border-radius: 8px; padding: 12px 18px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .card { background: var(--card); border: 1px solid var(--border); padding: 18px; border-radius: 8px; }
        .label { font-size: 0.65rem; color: #8b949e; text-transform: uppercase; font-weight: 700; letter-spacing: 0.5px; }
        .value { font-size: 1.4rem; font-weight: 800; color: white; margin-top: 5px; font-family: 'Courier New', monospace; }
        .chart-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(450px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .chart-box { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 15px; height: 350px; }
        .table-container { background: var(--card); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; margin-bottom: 25px; }
        table { width: 100%; border-collapse: collapse; font-family: monospace; font-size: 0.85rem; }
        th { text-align: left; padding: 12px; background: #1c2128; color: #8b949e; font-size: 0.7rem; cursor: pointer; user-select: none; border-bottom: 2px solid var(--border); }
        th:hover { color: white; background: #30363d; }
        td { padding: 12px; border-bottom: 1px solid var(--border); }
        h3 { font-size: 0.8rem; color: var(--accent); padding: 12px; margin: 0; background: #1c2128; border-bottom: 1px solid var(--border); }
        input { padding: 12px; width: 350px; background: #0d1117; border: 1px solid var(--border); color: white; border-radius: 6px; font-family: monospace; }
        .sort-icon { font-size: 0.6rem; margin-left: 5px; }
    </style>
</head>
<body>

<div id="auth-overlay">
    <div style="text-align:center">
        <h2>NGU TECH Dashboard</h2>
        <input type="text" id="wallet-input" placeholder="Enter Bitcoin Wallet Address">
        <button onclick="login()" style="padding:12px 24px; cursor:pointer; background: var(--accent); color: white; border: none; border-radius: 6px; font-weight: bold; margin-top: 10px;">SYNC DASHBOARD</button>
    </div>
</div>

<div class="container">
    <div class="pool-status">
        <div><span class="label">Pool Speed:</span> <span id="pool-hr" style="color:var(--accent); font-weight:bold;">...</span></div>
        <div><span class="label">Last Block:</span> <span id="p-height" style="color:white; font-weight:bold;">...</span></div>
        <div id="p-time" style="background:#30363d; padding:4px 10px; border-radius:4px; font-size:0.75rem">CONNECTING...</div>
    </div>

    <div class="grid">
        <div class="card"><div class="label">Account (5m HR)</div><div id="t_hr" class="value">0.00 PH/s</div></div>
        <div class="card"><div class="label">Fleet Size</div><div id="t_workers" class="value">0 Active</div></div>
        <div class="card"><div class="label">Unpaid Balance</div><div id="t_unpaid" class="value">0.00000000</div></div>
    </div>

    <div class="chart-container">
        <div class="chart-box"><canvas id="hashChart"></canvas></div>
        <div class="chart-box"><canvas id="liveChart"></canvas></div>
    </div>

    <div class="table-container">
        <h3>Miner Status</h3>
        <table id="minerTable">
            <thead>
                <tr>
                    <th onclick="handleSort(0)">Worker Name <span class="sort-icon">↕</span></th>
                    <th onclick="handleSort(1)">5 Min HR <span class="sort-icon">↕</span></th>
                    <th onclick="handleSort(2)">3 Hour HR <span class="sort-icon">↕</span></th>
                    <th onclick="handleSort(3)">24 Hour HR <span class="sort-icon">↕</span></th>
                    <th onclick="handleSort(4)">Status <span class="sort-icon">↕</span></th>
                </tr>
            </thead>
            <tbody id="worker-table"></tbody>
        </table>
    </div>

    <div class="table-container">
        <h3>Historical Earnings (Monthly Report)</h3>
        <table>
            <thead><tr><th>Height</th><th>Timestamp (UTC)</th><th>Net Reward (BTC)</th></tr></thead>
            <tbody id="earnings-table"></tbody>
        </table>
    </div>
</div>

<script>
    let WALLET = localStorage.getItem('ocean_wallet');
    const PROXY = 'https://api.allorigins.win/raw?url=';
    let hashChart, liveChart;
    let workerData = [];
    let currentSort = { col: null, asc: true };

    function login() { 
        const v = document.getElementById('wallet-input').value.trim(); 
        if(v) { localStorage.setItem('ocean_wallet', v); location.reload(); } 
    }

    function initCharts() {
        hashChart = new Chart(document.getElementById('hashChart').getContext('2d'), {
            type: 'line',
            data: { labels: [], datasets: [{ label: 'Account PH/s (History)', data: [], borderColor: '#58a6ff', backgroundColor: 'rgba(88,166,255,0.1)', fill: true, tension: 0.1, pointRadius: 0 }] },
            options: { responsive: true, maintainAspectRatio: false }
        });

        liveChart = new Chart(document.getElementById('liveChart').getContext('2d'), {
            data: {
                labels: [],
                datasets: [
                    { type: 'line', label: 'Hashrate (PH/s)', data: [], borderColor: '#3fb950', yAxisID: 'y', tension: 0.3, pointRadius: 0 },
                    { type: 'bar', label: 'Workers', data: [], backgroundColor: 'rgba(246,159,29,0.3)', yAxisID: 'y1' }
                ]
            },
            options: { 
                responsive: true, maintainAspectRatio: false,
                scales: { y: { position: 'left', title: { display: true, text: 'PH/s' } }, y1: { position: 'right', grid: { display: false }, title: { display: true, text: 'Active Workers' } } }
            }
        });
    }

    async function update() {
        if (!WALLET) return;
        document.getElementById('auth-overlay').style.display = 'none';

        try {
            const [hist, uFull, pool, poolHR, earns] = await Promise.all([
                fetch(PROXY + encodeURIComponent(`https://api.ocean.xyz/v1/history.json/${WALLET}`)).then(r => r.json()),
                fetch(PROXY + encodeURIComponent(`https://api.ocean.xyz/v1/userinfo_full/${WALLET}`)).then(r => r.json()),
                fetch(PROXY + encodeURIComponent(`https://api.ocean.xyz/v1/latest_block`)).then(r => r.json()),
                fetch(PROXY + encodeURIComponent(`https://api.ocean.xyz/v1/pool_hashrate`)).then(r => r.json()),
                fetch(PROXY + encodeURIComponent(`https://api.ocean.xyz/v1/monthly_earnings_report/${WALLET}`)).then(r => r.json())
            ]);

            // Top Status
            document.getElementById('pool-hr').innerText = (parseFloat(poolHR.result.pool_300s)/1e18).toFixed(2) + " EH/s";
            document.getElementById('p-height').innerText = "#" + pool.result.blocks[0].height;
            document.getElementById('p-time').innerText = "LIVE: " + new Date().toLocaleTimeString();

            // Stats Cards
            document.getElementById('t_hr').innerText = (uFull.result.user_full.hashrate_300s / 1e15).toFixed(2) + " PH/s";
            document.getElementById('t_unpaid').innerText = parseFloat(uFull.result.user_full.unpaid).toFixed(8);
            document.getElementById('t_workers').innerText = uFull.result.workers.length + " Active";

            // Charts
            if(hist.result) {
                const data = hist.result;
                hashChart.data.labels = data.map(p => new Date(p.timestamp * 1000).toLocaleDateString());
                hashChart.data.datasets[0].data = data.map(p => (p.hashrate / 1e15).toFixed(3));
                hashChart.update();

                const recent = data.slice(-144); // Last 12 hours
                liveChart.data.labels = recent.map(p => new Date(p.timestamp * 1000).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}));
                liveChart.data.datasets[0].data = recent.map(p => (p.hashrate / 1e15).toFixed(3));
                liveChart.data.datasets[1].data = recent.map(p => p.workers ? Object.keys(p.workers).length : 0);
                liveChart.update();
            }

            // Miner Data Mapping
            workerData = uFull.result.workers.map(obj => {
                const name = Object.keys(obj)[0];
                const s = obj[name];
                return {
                    name: name,
                    h5m: s.hashrate_300s / 1e12,
                    h3h: s.hashrate_10800s / 1e12,
                    h24h: s.hashrate_86400s / 1e12,
                    online: s.hashrate_300s > 0
                };
            });
            renderTable();

            // Earnings Table (NetUserRwd)
            const report = (earns.result?.report || []).filter(x => x.Blockheight !== "-1").reverse();
            document.getElementById('earnings-table').innerHTML = report.map(blk => `
                <tr>
                    <td>#${blk.Blockheight}</td>
                    <td>${blk.TimeUTC.replace('T', ' ').split('.')[0]}</td>
                    <td style="color:var(--ok)">${(parseInt(blk.NetUserRwd) / 1e8).toFixed(8)}</td>
                </tr>
            `).join('');

        } catch (e) { console.error("Refresh failed", e); }
    }

    function renderTable() {
        document.getElementById('worker-table').innerHTML = workerData.map(w => `
            <tr>
                <td><b>${w.name}</b></td>
                <td>${w.h5m.toFixed(2)} TH</td>
                <td>${w.h3h.toFixed(2)} TH</td>
                <td>${w.h24h.toFixed(2)} TH</td>
                <td style="color:${w.online ? 'var(--ok)' : 'var(--dead)'}">${w.online ? 'ONLINE' : 'OFFLINE'}</td>
            </tr>
        `).join('');
    }

    function handleSort(idx) {
        const keys = ['name', 'h5m', 'h3h', 'h24h', 'online'];
        const key = keys[idx];
        if (currentSort.col === idx) currentSort.asc = !currentSort.asc;
        else { currentSort.col = idx; currentSort.asc = true; }

        workerData.sort((a, b) => {
            let valA = a[key], valB = b[key];
            if (currentSort.asc) return valA > valB ? 1 : -1;
            return valA < valB ? 1 : -1;
        });
        renderTable();
    }

    if (WALLET) { initCharts(); update(); setInterval(update, 60000); }
</script>
</body>
</html>
