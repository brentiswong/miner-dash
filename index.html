<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NGU TECH - BTC Dual-View</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --bg: #0d1117; --card: #161b22; --text: #c9d1d9; --accent: #58a6ff; --worker-line: #ff7b72; --border: #30363d; --ok: #3fb950; --dead: #f85149; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); color: var(--text); padding: 15px; margin: 0; }
        .container { max-width: 1200px; margin: auto; }
        #auth-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); display: flex; align-items: center; justify-content: center; z-index: 1000; }
        .pool-status { background: #1c2128; border: 1px solid var(--border); border-radius: 8px; padding: 12px 18px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; flex-wrap: wrap; gap: 10px; }
        .pool-status span { color: var(--accent); font-weight: bold; }
        .pool-label { color: #8b949e; text-transform: uppercase; font-size: 0.65rem; font-weight: 700; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .card { background: var(--card); border: 1px solid var(--border); padding: 18px; border-radius: 8px; }
        .value { font-size: 1.5rem; font-weight: 800; color: white; margin-top: 5px; }
        .chart-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        @media (max-width: 900px) { .chart-grid { grid-template-columns: 1fr; } }
        .chart-box { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 15px; height: 300px; }
        .table-container { background: var(--card); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; margin-bottom: 25px; }
        table { width: 100%; border-collapse: collapse; font-family: monospace; font-size: 0.85rem; }
        th { text-align: left; padding: 12px; background: #1c2128; color: #8b949e; font-size: 0.7rem; text-transform: uppercase; }
        td { padding: 12px; border-bottom: 1px solid var(--border); }
        h3 { font-size: 0.85rem; color: var(--accent); padding: 15px; margin: 0; background: #1c2128; border-bottom: 1px solid var(--border); text-transform: uppercase; }
        input { width: 340px; padding: 12px; background: #0d1117; border: 1px solid var(--border); color: white; border-radius: 4px; }
        button { background: var(--accent); color: white; border: none; padding: 12px 24px; border-radius: 4px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

<div id="auth-overlay"><div style="text-align:center"><h2>NGU TECH Dashboard</h2><input type="text" id="wallet-input" placeholder="Enter BTC Address"><br><br><button onclick="login()">Sync Dashboard</button></div></div>

<div class="container">
    <div class="pool-status">
        <div><span class="pool-label">Pool HR:</span> <span id="pool-hr-global">...</span></div>
        <div><span class="pool-label">Last Block:</span> <span id="pool-height">...</span></div>
        <div id="pool-time" style="color:#8b949e">Loading...</div>
    </div>

    <div class="grid">
        <div class="card"><div class="pool-label">Unpaid (BTC)</div><div id="t_unpaid" class="value">0.00000000</div></div>
        <div class="card"><div class="pool-label">User Hashrate (5m)</div><div id="t_hr" class="value">0.00 PH/s</div></div>
        <div class="card"><div class="pool-label">Est. Next Block</div><div id="t_est" class="value">0.00000000</div></div>
    </div>

    <div class="chart-grid">
        <div class="chart-box">
            <h3 style="background:transparent; padding:0 0 10px 0">30-Day History (Daily Avg)</h3>
            <canvas id="histChart"></canvas>
        </div>
        <div class="chart-box">
            <h3 style="background:transparent; padding:0 0 10px 0">24H Live Performance</h3>
            <canvas id="liveChart"></canvas>
        </div>
    </div>

    <div class="table-container">
        <h3>Recent Block Earnings</h3>
        <table>
            <thead><tr><th>Height</th><th>Net Earnings (BTC)</th><th>Date (UTC)</th></tr></thead>
            <tbody id="reward-table"></tbody>
        </table>
    </div>
</div>

<script>
    let WALLET = localStorage.getItem('ocean_wallet');
    const PROXY = 'https://api.allorigins.win/raw?url=';
    let histChart, liveChart;
    const LIVE_LIMIT = 1440; // 24 hours in minutes

    function login() { 
        const v = document.getElementById('wallet-input').value.trim(); 
        if(v) { localStorage.setItem('ocean_wallet', v); location.reload(); } 
    }

    function timeAgo(date) {
        const seconds = Math.floor((new Date() - new Date(date)) / 1000);
        return seconds < 60 ? seconds + "s ago" : seconds < 3600 ? Math.floor(seconds/60) + "m ago" : Math.floor(seconds/3600) + "h ago";
    }

    async function update() {
        if (!WALLET) return;
        document.getElementById('auth-overlay').style.display = 'none';

        try {
            const [hrRes, uRes, earnRes, poolRes, poolHrRes] = await Promise.all([
                fetch(PROXY + encodeURIComponent(`https://api.ocean.xyz/v1/user_hashrate_full/${WALLET}`)),
                fetch(PROXY + encodeURIComponent(`https://api.ocean.xyz/v1/statsnap/${WALLET}`)),
                fetch(PROXY + encodeURIComponent(`https://api.ocean.xyz/v1/monthly_earnings_report/${WALLET}`)),
                fetch(PROXY + encodeURIComponent(`https://api.ocean.xyz/v1/latest_block`)),
                fetch(PROXY + encodeURIComponent(`https://api.ocean.xyz/v1/pool_hashrate`))
            ]);

            const hrData = await hrRes.json();
            const u = (await uRes.json()).result || {};
            const earnData = await earnRes.json();
            const poolData = await poolRes.json();
            const poolHrData = await poolHrRes.json();

            // Pool Info
            const lastPoolBlock = poolData.result?.blocks?.[0];
            if (lastPoolBlock) {
                document.getElementById('pool-height').innerText = "#" + lastPoolBlock.height;
                document.getElementById('pool-time').innerText = timeAgo(lastPoolBlock.ts + "Z");
            }
            if (poolHrData.result?.pool_300s) {
                document.getElementById('pool-hr-global').innerText = (parseFloat(poolHrData.result.pool_300s) / 1e18).toFixed(2) + " EH/s";
            }

            // User PH/s
            let t5 = 0, activeCount = 0;
            const workers = hrData.result?.workers || hrData.workers || {};
            Object.values(workers).forEach(w => {
                const s = Array.isArray(w) ? w[0] : w;
                const h = parseFloat(s.hashrate_300s || 0);
                t5 += h; if(h > 0) activeCount++;
            });
            const userPH = (t5/1e15).toFixed(2);
            document.getElementById('t_hr').innerText = userPH + " PH/s";
            document.getElementById('t_unpaid').innerText = parseFloat(u.unpaid||0).toFixed(8);
            document.getElementById('t_est').innerText = parseFloat(u.estimated_earn_next_block||0).toFixed(8);

            // Live Chart Update
            const ts = new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
            liveChart.data.labels.push(ts);
            liveChart.data.datasets[0].data.push(userPH);
            liveChart.data.datasets[1].data.push(activeCount);
            if(liveChart.data.labels.length > LIVE_LIMIT) { 
                liveChart.data.labels.shift(); liveChart.data.datasets[0].data.shift(); liveChart.data.datasets[1].data.shift(); 
            }
            liveChart.update();
            localStorage.setItem('live_history_24h', JSON.stringify({labels: liveChart.data.labels, hr: liveChart.data.datasets[0].data, workers: liveChart.data.datasets[1].data}));

            // Earnings Table
            const earnings = earnData.result?.report || [];
            document.getElementById('reward-table').innerHTML = earnings.filter(b => b.Blockheight !== "-1").sort((a,b) => b.Blockheight - a.Blockheight).slice(0, 10).map(b => `
                <tr><td>#${b.Blockheight}</td><td style="color:var(--ok)">${(b.NetUserRwd/1e8).toFixed(8)}</td><td>${b.TimeUTC.split('T')[0]}</td></tr>`).join('');

        } catch (e) { console.error(e); }
    }

    async function init() {
        // Init Hist Chart
        const histCtx = document.getElementById('histChart').getContext('2d');
        histChart = new Chart(histCtx, {
            type: 'bar',
            data: { labels: [], datasets: [{ label: 'Daily PH/s', data: [], backgroundColor: 'rgba(88,166,255,0.4)', borderColor: '#58a6ff', borderWidth: 1 }] },
            options: { responsive: true, maintainAspectRatio: false, scales: { y: { beginAtZero: true, grid: { color: '#30363d' } } } }
        });

        // Load History
        try {
            const hRes = await fetch(PROXY + encodeURIComponent(`https://api.ocean.xyz/v1/monthly_user_report/${WALLET}`));
            const hData = await hRes.json();
            const report = hData.result?.report || [];
            histChart.data.labels = report.filter(d => parseFloat(d.hashrate_avg_24hr_thsec) > 0).map(d => d.date.split('-')[2]);
            histChart.data.datasets[0].data = report.filter(d => parseFloat(d.hashrate_avg_24hr_thsec) > 0).map(d => (parseFloat(d.hashrate_avg_24hr_thsec)/1000).toFixed(2));
            histChart.update();
        } catch(e) { console.log("Hist load fail"); }

        // Init Live Chart
        const liveCtx = document.getElementById('liveChart').getContext('2d');
        const saved = JSON.parse(localStorage.getItem('live_history_24h') || '{"labels":[], "hr":[], "workers":[]}');
        liveChart = new Chart(liveCtx, {
            type: 'line',
            data: { 
                labels: saved.labels, 
                datasets: [
                    { label: 'PH/s', data: saved.hr, borderColor: '#58a6ff', fill: true, tension: 0.3, pointRadius: 0 },
                    { label: 'Miners', data: saved.workers, borderColor: '#ff7b72', yAxisID: 'y1', pointRadius: 0 }
                ] 
            },
            options: { 
                responsive: true, maintainAspectRatio: false, 
                scales: { 
                    y: { grid: { color: '#30363d' } },
                    y1: { position: 'right', grid: { display: false }, ticks: { precision: 0 } }
                }
            }
        });

        update(); setInterval(update, 60000);
    }
    if (WALLET) init();
</script>
</body>
</html>
