<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NGU TECH - Pro BTC Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --bg: #0d1117; --card: #161b22; --text: #c9d1d9; --accent: #58a6ff; --worker-line: #ff7b72; --border: #30363d; --ok: #3fb950; --dead: #f85149; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); color: var(--text); padding: 15px; margin: 0; }
        .container { max-width: 1200px; margin: auto; }
        #auth-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); display: flex; align-items: center; justify-content: center; z-index: 1000; }
        .pool-status { background: #1c2128; border: 1px solid var(--border); border-radius: 8px; padding: 12px 18px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; flex-wrap: wrap; gap: 10px; }
        .stat-item { display: flex; align-items: center; gap: 6px; }
        .pool-label { color: #8b949e; text-transform: uppercase; font-size: 0.65rem; font-weight: 700; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .card { background: var(--card); border: 1px solid var(--border); padding: 18px; border-radius: 8px; }
        .label { font-size: 0.65rem; color: #8b949e; text-transform: uppercase; font-weight: 700; }
        .value { font-size: 1.5rem; font-weight: 800; color: white; margin-top: 5px; }
        .sub-value { font-size: 0.8rem; margin-top: 4px; opacity: 0.8; }
        .chart-box { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 15px; height: 320px; position: relative; margin-bottom: 20px; }
        .table-container { background: var(--card); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; margin-bottom: 25px; }
        table { width: 100%; border-collapse: collapse; font-family: monospace; font-size: 0.85rem; }
        th { text-align: left; padding: 12px; background: #1c2128; color: #8b949e; font-size: 0.7rem; text-transform: uppercase; }
        td { padding: 12px; border-bottom: 1px solid var(--border); }
        h3 { font-size: 0.85rem; color: var(--accent); padding: 15px; margin: 0; background: #1c2128; border-bottom: 1px solid var(--border); text-transform: uppercase; }
        input { width: 340px; padding: 12px; background: #0d1117; border: 1px solid var(--border); color: white; border-radius: 4px; }
        .tables-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        @media (max-width: 900px) { .tables-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<div id="auth-overlay"><div style="text-align:center"><h2>NGU TECH</h2><input type="text" id="wallet-input" placeholder="BTC Address"><br><br><button onclick="login()" style="background:var(--accent);color:white;padding:10px 20px;border:none;border-radius:4px;cursor:pointer">Sync</button></div></div>

<div class="container">
    <div class="pool-status">
        <div class="stat-item"><span class="pool-label">Pool HR:</span> <span id="p-hr" style="color:var(--accent)">...</span></div>
        <div class="stat-item"><span class="pool-label">Last Block:</span> <span id="p-height" style="color:var(--accent)">...</span></div>
        <div class="stat-item"><span class="pool-label">Pool Reward:</span> <span id="p-full-rwd" style="color:var(--ok)">... BTC</span></div>
        <div class="stat-item"><span class="pool-label">Finder:</span> <span id="p-finder" style="color:var(--accent)">...</span></div>
        <div class="stat-item"><span class="pool-label">Window:</span> <span id="p-blocks" style="color:var(--accent)">...</span></div>
    </div>

    <div class="grid">
        <div class="card"><div class="label">Hashrate</div><div id="t_hr" class="value">0.00 PH/s</div><div id="t_hr_avg" class="sub-value">...</div></div>
        <div class="card"><div class="label">Unpaid</div><div id="t_unpaid" class="value">0.00000000</div><div id="t_usd" class="sub-value">...</div></div>
        <div class="card"><div class="label">Est. Next</div><div id="t_est" class="value">0.00000000</div><div id="t_shares" class="sub-value">...</div></div>
    </div>

    <div class="chart-box"><canvas id="liveChart"></canvas></div>

    <div class="tables-grid">
        <div class="table-container"><h3>Earnings</h3><table><thead><tr><th>Date</th><th>Block</th><th>BTC</th></tr></thead><tbody id="earnings-table"></tbody></table></div>
        <div class="table-container"><h3>Payouts</h3><table><thead><tr><th>Date</th><th>BTC</th><th>TX</th></tr></thead><tbody id="payouts-table"></tbody></table></div>
    </div>
</div>

<script>
    let WALLET = localStorage.getItem('ocean_wallet');
    const PROXY = 'https://api.codetabs.com/v1/proxy?quest=';
    let liveChart;
    const satsToBtc = (sats) => (parseFloat(sats || 0) / 100000000).toFixed(8);

    function login() { const v = document.getElementById('wallet-input').value.trim(); if(v) { localStorage.setItem('ocean_wallet', v); location.reload(); } }

    async function fetchRecursiveReport(type, limit = 10) {
        let results = [];
        let date = new Date();
        for (let i = 0; i < 6; i++) {
            const y = date.getFullYear();
            const m = String(date.getMonth() + 1).padStart(2, '0');
            const ep = type === 'earnings' ? 'monthly_earnings_report' : 'monthly_payout_report';
            try {
                const res = await fetch(PROXY + encodeURIComponent(`https://api.ocean.xyz/v1/${ep}/${WALLET}/${y}-${m}`));
                const data = await res.json();
                const report = data.result?.report || [];
                const filtered = type === 'earnings' ? report.filter(r => r.Blockheight !== "-1") : report;
                results.push(...filtered);
                if (results.length >= limit) break;
            } catch (e) {}
            date.setMonth(date.getMonth() - 1);
        }
        return results.sort((a,b) => new Date(b.TimeUTC) - new Date(a.TimeUTC)).slice(0, limit);
    }

    async function update() {
        if (!WALLET) return;
        document.getElementById('auth-overlay').style.display = 'none';
        try {
            const [hrRes, uRes, pHRRes, blocksRes, mempoolRes, earnings, payouts] = await Promise.all([
                fetch(PROXY + encodeURIComponent(`https://api.ocean.xyz/v1/user_hashrate_full/${WALLET}`)),
                fetch(PROXY + encodeURIComponent(`https://api.ocean.xyz/v1/statsnap/${WALLET}`)),
                fetch(PROXY + encodeURIComponent(`https://api.ocean.xyz/v1/pool_hashrate`)),
                fetch(PROXY + encodeURIComponent(`https://api.ocean.xyz/v1/blocks?page=0&page_size=30`)),
                fetch(`https://mempool.space/api/v1/mining/pool/ocean/blocks`),
                fetchRecursiveReport('earnings'),
                fetchRecursiveReport('payouts')
            ]);

            const hrData = await hrRes.json();
            const u = (await uRes.json()).result || {};
            const pHR = await pHRRes.json();
            const blocksData = await blocksRes.json();
            const mBlocks = await mempoolRes.json();

            // Mempool Structure Logic
            if (mBlocks && mBlocks.length > 0) {
                const b = mBlocks[0];
                document.getElementById('p-height').innerText = "#" + b.height;
                // Use reward from extras
                document.getElementById('p-full-rwd').innerText = satsToBtc(b.extras?.reward) + " BTC";
                
                // Use 2nd half of minerNames if available
                const names = b.extras?.pool?.minerNames || [];
                document.getElementById('p-finder').innerText = names.length > 1 ? names[1] : (names[0] || "OCEAN");
            }

            const poolBlocks = blocksData.result?.blocks || [];
            const block = poolBlocks[0] || {};
            const sharelog = parseFloat(block.sharelog_window || 0);
            let k = 0, cum = 0;
            for (const b of poolBlocks) { cum += parseFloat(b.accepted_shares || 0); k++; if (cum >= sharelog) break; }
            document.getElementById('p-blocks').innerText = k;

            document.getElementById('p-hr').innerText = (parseFloat(pHR.result?.pool_300s||0)/1e18).toFixed(2) + " EH/s";
            document.getElementById('t_unpaid').innerText = parseFloat(u.unpaid||0).toFixed(8);
            document.getElementById('t_est').innerText = parseFloat(u.estimated_earn_next_block||0).toFixed(8);

            // Miners
            let t5=0, active=0;
            const ws = hrData.result?.workers || {};
            Object.keys(ws).forEach(n => { if(parseFloat(ws[n][0].hashrate_300s) > 0) { t5 += parseFloat(ws[n][0].hashrate_300s); active++; } });
            document.getElementById('t_hr').innerText = (t5/1e15).toFixed(2) + " PH/s";

            // Table Rendering
            document.getElementById('earnings-table').innerHTML = earnings.map(e => `<tr><td>${e.TimeUTC.substring(5,16)}</td><td>${e.Blockheight}</td><td>${satsToBtc(e.NetUserRwd)}</td></tr>`).join('');
            document.getElementById('payouts-table').innerHTML = payouts.map(p => `<tr><td>${p.TimeUTC.substring(5,16)}</td><td>${satsToBtc(p.PayoutAmt)}</td><td>${p.TXID.substring(0,6)}</td></tr>`).join('');

            const time = new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
            liveChart.data.labels.push(time);
            liveChart.data.datasets[0].data.push((t5/1e15).toFixed(2));
            if(liveChart.data.labels.length > 50) { liveChart.data.labels.shift(); liveChart.data.datasets[0].data.shift(); }
            liveChart.update();
        } catch (e) {}
    }

    const ctx = document.getElementById('liveChart').getContext('2d');
    liveChart = new Chart(ctx, { type: 'line', data: { labels: [], datasets: [{ label: 'PH/s', data: [], borderColor: '#58a6ff', tension: 0.2, pointRadius: 0 }] }, options: { responsive: true, maintainAspectRatio: false } });
    if (WALLET) { update(); setInterval(update, 60000); }
</script>
</body>
</html>
