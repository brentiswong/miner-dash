<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NGU TECH - bc1q76zgkz... Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --bg: #0d1117; --card: #161b22; --text: #c9d1d9; --accent: #58a6ff; --border: #30363d; --ok: #3fb950; --dead: #f85149; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); color: var(--text); padding: 15px; margin: 0; }
        .container { max-width: 1200px; margin: auto; }
        .pool-status { background: #1c2128; border: 1px solid var(--border); border-radius: 8px; padding: 12px 18px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; flex-wrap: wrap; gap: 10px; }
        .stat-item { display: flex; align-items: center; gap: 6px; }
        .pool-label { color: #8b949e; text-transform: uppercase; font-size: 0.65rem; font-weight: 700; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .card { background: var(--card); border: 1px solid var(--border); padding: 18px; border-radius: 8px; }
        .value { font-size: 1.5rem; font-weight: 800; color: white; margin-top: 5px; font-family: monospace; }
        .chart-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        @media (max-width: 900px) { .chart-grid { grid-template-columns: 1fr; } }
        .chart-box { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 15px; height: 350px; position: relative; }
        table { width: 100%; border-collapse: collapse; font-family: monospace; font-size: 0.85rem; background: var(--card); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
        th { text-align: left; padding: 12px; background: #1c2128; color: #8b949e; font-size: 0.7rem; text-transform: uppercase; }
        td { padding: 12px; border-bottom: 1px solid var(--border); }
        #status-bar { font-size: 0.7rem; color: var(--accent); margin-bottom: 10px; font-weight: bold; background: #1c2128; padding: 5px 10px; border-radius: 4px; display: inline-block; }
        .controls { position: absolute; top: 10px; right: 15px; z-index: 10; display: flex; gap: 5px; }
        .btn-sm { background: #30363d; color: white; border: none; padding: 4px 10px; border-radius: 4px; font-size: 0.65rem; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <div id="status-bar">CONNECTING TO NODES...</div>
    
    <div class="pool-status">
        <div class="stat-item"><span class="pool-label">Pool HR:</span> <span id="p-hr-global">...</span></div>
        <div class="stat-item"><span class="pool-label">Block:</span> <span id="p-height">...</span></div>
        <div class="stat-item"><span class="pool-label">Finder:</span> <span id="p-finder">...</span></div>
        <div id="p-time" style="color:#8b949e">Syncing...</div>
    </div>

    <div class="grid">
        <div class="card"><div class="pool-label">User Hashrate (5M)</div><div id="t_hr" class="value">...</div></div>
        <div class="card"><div class="pool-label">Est Next Block</div><div id="t_est" class="value" style="color:var(--accent)">...</div></div>
        <div class="card"><div class="pool-label">Unpaid Balance</div><div id="t_unpaid" class="value" style="color:var(--ok)">...</div></div>
    </div>

    <div class="chart-grid">
        <div class="chart-box">
            <div class="controls">
                <button class="btn-sm" onclick="filterHist(30)">1M</button>
                <button class="btn-sm" onclick="filterHist(365)">1Y</button>
                <button class="btn-sm" onclick="filterHist(0)">ALL</button>
            </div>
            <h3 style="margin:0 0 10px 0; font-size:0.8rem">Historical (PH/s)</h3>
            <canvas id="histChart"></canvas>
        </div>
        <div class="chart-box">
            <h3 style="margin:0 0 10px 0; font-size:0.8rem">Live 24H PH/s</h3>
            <canvas id="liveChart"></canvas>
        </div>
    </div>

    <table>
        <thead><tr><th>Worker</th><th>5m (TH)</th><th>3h (TH)</th><th>24h (TH)</th><th>Status</th></tr></thead>
        <tbody id="worker-table"></tbody>
    </table>
</div>

<script>
    const WALLET = "bc1q76zgkz5ussy2hl54vdz7nv0q96kta82ckdu7ys";
    const PROXY = 'https://api.allorigins.win/raw?url=';
    let histChart, liveChart, fullHistData = [];

    function setText(id, text) {
        const el = document.getElementById(id);
        if (el) el.innerText = text;
    }

    async function init() {
        initCharts();
        try {
            const res = await fetch('history.json');
            const data = await res.json();
            fullHistData = data.result.report.filter(d => parseFloat(d.hashrate_avg_24hr_thsec) > 0).sort((a,b) => new Date(a.date) - new Date(b.date));
            filterHist(0);
            setText('status-bar', "SYSTEM READY");
        } catch (e) { setText('status-bar', "CACHE MISSING - RUN SYNC"); }
        updateLive();
        setInterval(updateLive, 60000);
    }

    async function updateLive() {
        try {
            const [hrRes, uRes, pRes, phRes] = await Promise.all([
                fetch(PROXY + encodeURIComponent(`https://api.ocean.xyz/v1/user_hashrate_full/${WALLET}`)),
                fetch(PROXY + encodeURIComponent(`https://api.ocean.xyz/v1/statsnap/${WALLET}`)),
                fetch(PROXY + encodeURIComponent(`https://api.ocean.xyz/v1/latest_block`)),
                fetch(PROXY + encodeURIComponent(`https://api.ocean.xyz/v1/pool_hashrate`))
            ]);
            
            const hr = await hrRes.json();
            const u = await uRes.json();
            const p = await pRes.json();
            const ph = await phRes.json();

            setText('t_hr', (parseFloat(hr.result?.total_300s || 0)/1e15).toFixed(2) + " PH/s");
            setText('t_unpaid', parseFloat(u.result?.unpaid || 0).toFixed(8) + " BTC");
            setText('t_est', parseFloat(u.result?.estimated_earn_next_block || 0).toFixed(8) + " BTC");
            setText('p-hr-global', (parseFloat(ph.result?.pool_300s || 0)/1e18).toFixed(2) + " EH/s");

            const block = p.result?.blocks[0] || {};
            setText('p-height', "#" + (block.height || "---"));
            setText('p-finder', block.username ? (block.username.substring(0,8)) : "---");

            if (block.ts) {
                // BUG FIX: Strip 6-digit microseconds down to 3 digits for JS Date compatibility
                const rawDate = block.ts; // e.g., "2025-12-22T17:17:23.098500"
                const cleanDate = rawDate.split('.')[0] + "." + rawDate.split('.')[1].substring(0, 3);
                
                const blockTime = new Date(cleanDate + "Z");
                const diff = Math.floor((new Date() - blockTime) / 1000);
                const timeStr = diff < 60 ? diff + "s ago" : diff < 3600 ? Math.floor(diff/60) + "m ago" : Math.floor(diff/3600) + "h ago";
                setText('p-time', timeStr);
            }

            // Live Chart logic
            const now = new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
            liveChart.data.labels.push(now);
            liveChart.data.datasets[0].data.push((parseFloat(hr.result?.total_300s || 0)/1e15).toFixed(2));
            if(liveChart.data.labels.length > 24) { liveChart.data.labels.shift(); liveChart.data.datasets[0].data.shift(); }
            liveChart.update();

            const ws = hr.result?.workers || {};
            document.getElementById('worker-table').innerHTML = Object.keys(ws).map(n => {
                const s = ws[n][0];
                return `<tr><td>${n}</td><td>${(s.hashrate_300s/1e12).toFixed(2)}</td><td>${(s.hashrate_10800s/1e12).toFixed(2)}</td><td>${(s.hashrate_86400s/1e12).toFixed(2)}</td><td style="color:${s.hashrate_300s > 0 ? 'var(--ok)':'var(--dead)'}">●</td></tr>`;
            }).join('');
            
        } catch(e) { console.error("Sync error:", e); }
    }

    function filterHist(days) {
        if (!fullHistData.length) return;
        const filtered = days === 0 ? fullHistData : fullHistData.slice(-days);
        histChart.data.labels = filtered.map(d => d.date);
        histChart.data.datasets[0].data = filtered.map(d => (parseFloat(d.hashrate_avg_24hr_thsec)/1000).toFixed(2));
        histChart.update();
    }

    function initCharts() {
        histChart = new Chart(document.getElementById('histChart'), { type: 'line', data: { labels: [], datasets: [{ label: 'PH/s', data: [], borderColor: '#58a6ff', fill: true, backgroundColor: 'rgba(88,166,255,0.05)', pointRadius: 0, tension: 0.2 }] }, options: { responsive: true, maintainAspectRatio: false } });
        liveChart = new Chart(document.getElementById('liveChart'), { type: 'line', data: { labels: [], datasets: [{ label: 'PH/s', data: [], borderColor: '#ff7b72', pointRadius: 2, tension: 0.4 }] }, options: { responsive: true, maintainAspectRatio: false } });
    }
    init();
</script>
</body>
</html>
