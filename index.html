<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NGU TECH - Pro BTC Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* Your existing styles unchanged */
        :root { --bg: #0d1117; --card: #161b22; --text: #c9d1d9; --accent: #58a6ff; --worker-line: #ff7b72; --border: #30363d; --ok: #3fb950; --dead: #f85149; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); color: var(--text); padding: 15px; margin: 0; }
        .container { max-width: 1200px; margin: auto; }
        #auth-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); display: flex; align-items: center; justify-content: center; z-index: 1000; flex-direction: column; }
        .pool-status { background: #1c2128; border: 1px solid var(--border); border-radius: 8px; padding: 12px 18px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; flex-wrap: wrap; gap: 10px; }
        .stat-item { display: flex; align-items: center; gap: 6px; }
        .pool-label { color: #8b949e; text-transform: uppercase; font-size: 0.65rem; font-weight: 700; }
        /* ... rest of styles ... */
        input { width: 340px; padding: 12px; background: #0d1117; border: 1px solid var(--border); color: white; border-radius: 4px; margin: 15px 0; }
        button#login-btn { background: var(--accent); color: white; border: none; padding: 12px 24px; border-radius: 4px; cursor: pointer; font-weight: bold; touch-action: manipulation; }
        #status-msg { margin-top: 20px; color: #f85149; font-size: 0.9rem; }
    </style>
</head>
<body>

<div id="auth-overlay">
    <div style="text-align:center">
        <h2>NGU TECH Dashboard</h2>
        <input type="text" id="wallet-input" placeholder="Enter BTC Address">
        <br><br>
        <button id="login-btn">Sync Dashboard</button>
        <div id="status-msg"></div>
    </div>
</div>

<!-- Rest of HTML unchanged -->

<script>
    let WALLET = localStorage.getItem('ocean_wallet');
    const PROXY = 'https://api.codetabs.com/v1/proxy?quest=';
    // ... variables unchanged ...

    // Fixed login with better mobile support
    document.getElementById('login-btn').addEventListener('click', login);
    document.getElementById('wallet-input').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') login();
    });

    function login() { 
        const v = document.getElementById('wallet-input').value.trim(); 
        const msg = document.getElementById('status-msg');
        msg.textContent = '';
        if (!v) {
            msg.textContent = 'Please enter a BTC address';
            return;
        }
        if (!v.startsWith('bc1')) {
            msg.textContent = 'Invalid address (must start with bc1)';
            return;
        }
        msg.textContent = 'Syncing...';
        localStorage.setItem('ocean_wallet', v);
        location.reload(); 
    }

    // ... rest of functions unchanged ...

    async function update() {
        document.getElementById('auth-overlay').style.display = 'none';

        if (!WALLET) return;

        try {
            // ... fetches unchanged ...

            const block = pData.result?.blocks?.[0] || {};

            // ... other stats ...

            // Fixed TIDES Luck %
            if (block.sharelog_window && block.network_difficulty) {
                const sharelog = parseFloat(block.sharelog_window);
                const diff = parseFloat(block.network_difficulty);
                const b32 = Math.pow(2, 32);
                const luck = (diff * b32 / sharelog) * 100;
                document.getElementById('p-luck').innerText = luck.toFixed(1) + "%";
            } else {
                document.getElementById('p-luck').innerText = "...";
            }

            // TIDES Blocks (from earnings history - blocks you contributed to in window)
            document.getElementById('p-blocks').innerText = recentEarningsCount || "0";

            // ... rest ...

            if (!window.earningsLoaded) {
                await fetchAndRenderEarnings();
                window.earningsLoaded = true;
            }

        } catch (e) {
            console.error(e);
            // Friendly message
            document.querySelectorAll('.value, .sub-value').forEach(el => el.textContent = 'No activity yet');
        }
    }

    // init unchanged, but calls update() which hides overlay

    init();
</script>
</body>
</html>
