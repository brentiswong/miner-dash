<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NGU TECH - Stable Miner</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --bg: #0d1117; --card: #161b22; --text: #c9d1d9; --accent: #58a6ff; --border: #30363d; --ok: #3fb950; --err: #f85149; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); color: var(--text); padding: 20px; margin: 0; }
        .container { max-width: 1200px; margin: auto; }
        #auth-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); display: flex; align-items: center; justify-content: center; z-index: 1000; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 15px; margin-bottom: 25px; }
        .card { background: var(--card); border: 1px solid var(--border); padding: 20px; border-radius: 10px; }
        .label { font-size: 0.7rem; color: #8b949e; text-transform: uppercase; }
        .value { font-size: 1.6rem; font-weight: bold; color: white; margin-top: 5px; }
        .table-container { background: var(--card); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; margin-top: 20px; }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 12px; background: #1c2128; color: #8b949e; font-size: 0.7rem; }
        td { padding: 12px; border-bottom: 1px solid var(--border); font-family: monospace; }
        input { width: 300px; padding: 12px; background: #0d1117; border: 1px solid var(--border); color: white; border-radius: 6px; }
        button { background: var(--accent); color: white; border: none; padding: 12px 24px; border-radius: 6px; cursor: pointer; }
    </style>
</head>
<body>

<div id="auth-overlay"><div style="text-align:center"><h2>NGU TECH</h2><input type="text" id="wallet-input" placeholder="BTC Address"><br><br><button onclick="login()">Enter</button></div></div>

<div class="container">
    <div class="grid">
        <div class="card">
            <div class="label">Total Hashrate</div>
            <div id="t_hr" class="value">--</div>
            <div id="t_hr_sub" style="font-size:0.8rem; color:var(--accent)">PH/s</div>
        </div>
        <div class="card">
            <div class="label">TIDES Status</div>
            <div id="t_blocks" class="value">Active</div>
            <div id="t_shares" style="font-size:0.8rem; color:var(--ok)">-- Shares</div>
        </div>
        <div class="card">
            <div class="label">Unpaid Balance</div>
            <div id="t_unpaid" class="value">--</div>
            <div id="t_usd" style="font-size:0.8rem; color:var(--ok)">$0.00 USD</div>
        </div>
        <div class="card">
            <div class="label">Est. Next Reward</div>
            <div id="t_est" class="value">--</div>
            <div style="font-size:0.8rem">BTC / Block</div>
        </div>
    </div>

    <div class="table-container">
        <table>
            <thead><tr><th>Worker</th><th>5m Hashrate</th><th>3h Hashrate</th><th>Status</th></tr></thead>
            <tbody id="worker-table"></tbody>
        </table>
    </div>
</div>

<script>
    let WALLET = localStorage.getItem('ocean_wallet');
    const PROXY = 'https://api.allorigins.win/raw?url=';
    
    function login() { const v = document.getElementById('wallet-input').value.trim(); if(v) { localStorage.setItem('ocean_wallet', v); location.reload(); } }

    async function update() {
        if (!WALLET) return;
        document.getElementById('auth-overlay').style.display = 'none';

        try {
            const priceRes = await fetch("https://api.coinbase.com/v2/prices/BTC-USD/spot");
            const price = parseFloat((await priceRes.json()).data.amount);

            // Fetch Worker Data
            const hrRes = await fetch(PROXY + encodeURIComponent(`https://api.ocean.xyz/v1/user_hashrate_full/${WALLET}`));
            const hrData = await hrRes.json();
            
            // Fetch Payout/Stats Data
            const statsRes = await fetch(PROXY + encodeURIComponent(`https://api.ocean.xyz/v1/statsnap/${WALLET}`));
            const statsData = await statsRes.json();
            const u = statsData.result || statsData;

            // 1. Process Workers
            const workers = hrData.result?.workers || hrData.workers || {};
            let totalH = 0, rows = "";
            Object.keys(workers).forEach(name => {
                const s = Array.isArray(workers[name]) ? workers[name][0] : workers[name];
                const h5 = parseFloat(s.hashrate_300s || 0);
                totalH += h5;
                rows += `<tr><td>${name}</td><td>${(h5/1e15).toFixed(2)} PH/s</td><td>${(parseFloat(s.hashrate_10800s)/1e15).toFixed(2)} PH/s</td><td style="color:var(--ok)">ON</td></tr>`;
            });
            document.getElementById('worker-table').innerHTML = rows;

            // 2. Main Stats
            document.getElementById('t_hr').innerText = (totalH / 1e15).toFixed(2) + " PH/s";
            document.getElementById('t_unpaid').innerText = parseFloat(u.unpaid || 0).toFixed(6) + " BTC";
            document.getElementById('t_usd').innerText = "$" + (parseFloat(u.unpaid || 0) * price).toFixed(2);
            document.getElementById('t_est').innerText = parseFloat(u.estimated_earn_next_block || 0).toFixed(6);
            document.getElementById('t_shares').innerText = (parseFloat(u.shares_in_tides || 0) / 1e9).toFixed(1) + "G Shares";

        } catch (e) { console.error("Error updating:", e); }
    }

    if (WALLET) { update(); setInterval(update, 60000); }
</script>
</body>
</html>
