<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NGU TECH DEBUG</title>
    <style>
        body { background: #0d1117; color: #c9d1d9; font-family: sans-serif; padding: 20px; margin: 0; }
        .box { background: #161b22; border: 1px solid #30363d; padding: 15px; border-radius: 8px; margin-bottom: 10px; }
        .row { display: flex; justify-content: space-between; margin-bottom: 10px; border-bottom: 1px solid #30363d; padding-bottom: 5px; }
        .label { color: #8b949e; font-size: 0.8rem; text-transform: uppercase; }
        .val { font-family: monospace; font-weight: bold; color: #58a6ff; }
        #debug { color: #f85149; font-size: 0.7rem; margin-top: 20px; white-space: pre-wrap; }
    </style>
</head>
<body>

    <div class="box">
        <div class="row"><span class="label">Status:</span> <span id="s-status" class="val">INITIALIZING</span></div>
        <div class="row"><span class="label">Last Block:</span> <span id="s-height" class="val">---</span></div>
        <div class="row"><span class="label">Finder:</span> <span id="s-finder" class="val">---</span></div>
        <div class="row"><span class="label">Time Ago:</span> <span id="s-time" class="val" style="color:#3fb950">---</span></div>
    </div>

    <div class="box">
        <div class="row"><span class="label">User PH/s:</span> <span id="s-hr" class="val">---</span></div>
        <div class="row"><span class="label">Unpaid BTC:</span> <span id="s-unpaid" class="val">---</span></div>
    </div>

    <div id="debug">Log: Starting...</div>

<script>
    const WALLET = "bc1q76zgkz5ussy2hl54vdz7nv0q96kta82ckdu7ys";
    const PROXY = 'https://api.allorigins.win/raw?url=';

    function setDebug(msg) {
        document.getElementById('debug').innerText += "\n> " + msg;
    }

    async function update() {
        try {
            setDebug("Step 1: Fetching Ocean API...");
            
            const response = await fetch(PROXY + encodeURIComponent(`https://api.ocean.xyz/v1/latest_block`));
            if (!response.ok) throw new Error("Proxy failed");
            
            const data = await response.json();
            setDebug("Step 2: JSON parsed successfully.");

            const block = data.result.blocks[0];
            document.getElementById('s-height').innerText = "#" + block.height;
            document.getElementById('s-finder').innerText = block.username.substring(0,10);
            
            setDebug("Step 3: Calculating time for " + block.ts);

            // The simplest possible time math
            const blockDate = new Date(block.ts.replace('T', ' ').split('.')[0] + " UTC");
            const now = new Date();
            const diff = Math.floor((now - blockDate) / 1000);

            let displayTime = diff + "s ago";
            if (diff > 60) displayTime = Math.floor(diff/60) + "m ago";
            if (diff < 0) displayTime = "Just now";
            
            document.getElementById('s-time').innerText = displayTime;
            document.getElementById('s-status').innerText = "ONLINE";
            setDebug("Step 4: All updates complete.");

            // Fetch User Stats
            const uRes = await fetch(PROXY + encodeURIComponent(`https://api.ocean.xyz/v1/statsnap/${WALLET}`));
            const uData = await uRes.json();
            document.getElementById('s-unpaid').innerText = uData.result.unpaid + " BTC";

        } catch (e) {
            setDebug("ERROR: " + e.message);
            document.getElementById('s-status').innerText = "FAILED";
        }
    }

    // Run immediately
    update();
    // Refresh every 30 seconds
    setInterval(update, 30000);
</script>
</body>
</html>
