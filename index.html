<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NGU TECH - Pro BTC Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --bg: #0d1117; --card: #161b22; --text: #c9d1d9; --accent: #58a6ff; --border: #30363d; --ok: #3fb950; --dead: #f85149; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); color: var(--text); padding: 15px; margin: 0; }
        .container { max-width: 1200px; margin: auto; }
        #auth-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); display: flex; align-items: center; justify-content: center; z-index: 1000; }
        .pool-status { background: #1c2128; border: 1px solid var(--border); border-radius: 8px; padding: 12px 18px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .card { background: var(--card); border: 1px solid var(--border); padding: 18px; border-radius: 8px; }
        .label { font-size: 0.65rem; color: #8b949e; text-transform: uppercase; font-weight: 700; }
        .value { font-size: 1.5rem; font-weight: 800; color: white; margin-top: 5px; }
        .chart-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        .chart-box { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 15px; height: 320px; }
        .table-container { background: var(--card); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; margin-bottom: 25px; }
        table { width: 100%; border-collapse: collapse; font-family: monospace; font-size: 0.85rem; }
        th { text-align: left; padding: 12px; background: #1c2128; color: #8b949e; text-transform: uppercase; }
        td { padding: 12px; border-bottom: 1px solid var(--border); }
        h3 { font-size: 0.85rem; color: var(--accent); padding: 15px; margin: 0; background: #1c2128; border-bottom: 1px solid var(--border); text-transform: uppercase; }
        input { width: 340px; padding: 12px; background: #0d1117; border: 1px solid var(--border); color: white; border-radius: 4px; }
        button { background: var(--accent); color: white; border: none; padding: 12px 24px; border-radius: 4px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

<div id="auth-overlay"><div style="text-align:center"><h2>NGU TECH Dashboard</h2><input type="text" id="wallet-input" placeholder="Enter BTC Address"><br><br><button onclick="login()">Sync Dashboard</button></div></div>

<div class="container">
    <div class="pool-status">
        <div><span class="label">Pool Hashrate:</span> <span id="p-hr" style="color:var(--accent)">...</span></div>
        <div><span class="label">Last Block:</span> <span id="p-height" style="color:var(--accent)">...</span></div>
        <div><span class="label">Finder:</span> <span id="p-finder" style="color:var(--accent)">...</span></div>
        <div id="p-time" style="color:#8b949e">Loading...</div>
    </div>

    <div class="grid">
        <div class="card"><div class="label">Hashrate (5m)</div><div id="t_hr" class="value">0.00 PH/s</div></div>
        <div class="card"><div class="label">Unpaid (BTC)</div><div id="t_unpaid" class="value">0.00000000</div></div>
        <div class="card"><div class="label">Est. Next Block</div><div id="t_est" class="value">0.00000000</div></div>
    </div>

    <div class="chart-grid">
        <div class="chart-box"><h3>History</h3><canvas id="histChart"></canvas></div>
        <div class="chart-box"><h3>Live Hashrate</h3><canvas id="liveChart"></canvas></div>
    </div>

    <div class="table-container">
        <h3>Miner Status</h3>
        <table>
            <thead><tr><th>Name</th><th>5m Hash</th><th>Status</th></tr></thead>
            <tbody id="worker-table"></tbody>
        </table>
    </div>
</div>

<script>
    let WALLET = localStorage.getItem('ocean_wallet');
    const PROXY = 'https://api.allorigins.win/raw?url=';
    let liveChart, histChart;

    function login() { const v = document.getElementById('wallet-input').value.trim(); if(v) { localStorage.setItem('ocean_wallet', v); location.reload(); } }

    async function getPoolName(height) {
        try {
            // Step 1: Get Hash from Height
            const hRes = await fetch(`https://mempool.space/api/block-height/${height}`);
            const hash = await hRes.text();
            // Step 2: Get Block Details (using direct URL to avoid CORS on metadata)
            const dRes = await fetch(`https://mempool.space/api/block/${hash}`);
            const data = await dRes.json();
            return data.extras?.pool?.name || null;
        } catch (e) { return null; }
    }

    async function update() {
        if (!WALLET) return;
        document.getElementById('auth-overlay').style.display = 'none';

        try {
            const [hrRes, uRes, poolRes, pHRRes] = await Promise.all([
                fetch(PROXY + encodeURIComponent(`https://api.ocean.xyz/v1/user_hashrate_full/${WALLET}`)),
                fetch(PROXY + encodeURIComponent(`https://api.ocean.xyz/v1/statsnap/${WALLET}`)),
                fetch(PROXY + encodeURIComponent(`https://api.ocean.xyz/v1/latest_block`)),
                fetch(PROXY + encodeURIComponent(`https://api.ocean.xyz/v1/pool_hashrate`))
            ]);

            const hrData = await hrRes.json();
            const u = (await uRes.json()).result || {};
            const pData = await poolRes.json();
            const pHR = await pHRRes.json();

            const block = pData.result?.blocks?.[0] || {};
            document.getElementById('p-height').innerText = "#" + (block.height || "...");
            document.getElementById('p-hr').innerText = (parseFloat(pHR.result?.pool_300s||0)/1e18).toFixed(2) + " EH/s";

            // Update Finder with correct Mempool Logic
            if (block.height) {
                getPoolName(block.height).then(name => {
                    document.getElementById('p-finder').innerText = name || block.username || "OCEAN Miner";
                });
            }

            document.getElementById('t_unpaid').innerText = parseFloat(u.unpaid||0).toFixed(8);
            document.getElementById('t_est').innerText = parseFloat(u.estimated_earn_next_block||0).toFixed(8);

            let t5 = 0;
            const ws = hrData.result?.workers || hrData.workers || {};
            let html = '';
            Object.keys(ws).forEach(n => {
                const s = Array.isArray(ws[n]) ? ws[n][0] : ws[n];
                const h5 = parseFloat(s.hashrate_300s||0);
                t5 += h5;
                html += `<tr><td>${n}</td><td>${(h5/1e12).toFixed(2)} TH/s</td><td style="color:${h5>0?'var(--ok)':'var(--dead)'}">● ${h5>0?'ACTIVE':'DEAD'}</td></tr>`;
            });
            document.getElementById('worker-table').innerHTML = html;
            const currentPH = (t5/1e15).toFixed(2);
            document.getElementById('t_hr').innerText = currentPH + " PH/s";

            // Fix Live Chart Update
            if (liveChart) {
                const now = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                liveChart.data.labels.push(now);
                liveChart.data.datasets[0].data.push(currentPH);
                if(liveChart.data.labels.length > 30) { liveChart.data.labels.shift(); liveChart.data.datasets[0].data.shift(); }
                liveChart.update();
            }

        } catch (e) { console.error(e); }
    }

    window.onload = () => {
        const ctxL = document.getElementById('liveChart').getContext('2d');
        liveChart = new Chart(ctxL, {
            type: 'line',
            data: { labels: [], datasets: [{ label: 'PH/s', data: [], borderColor: '#58a6ff', tension: 0.4 }] },
            options: { responsive: true, maintainAspectRatio: false }
        });

        const ctxH = document.getElementById('histChart').getContext('2d');
        histChart = new Chart(ctxH, {
            type: 'bar',
            data: { labels: ['Today'], datasets: [{ label: 'Daily Avg', data: [0], backgroundColor: '#58a6ff' }] },
            options: { responsive: true, maintainAspectRatio: false }
        });

        if (WALLET) { update(); setInterval(update, 60000); }
    };
</script>
</body>
</html>
