<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NGU TECH - Precision Miner</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --bg: #0d1117; --card: #161b22; --text: #c9d1d9; --accent: #58a6ff; --border: #30363d; --ok: #3fb950; --warn: #d29922; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); color: var(--text); padding: 20px; margin: 0; }
        .container { max-width: 1200px; margin: auto; }
        #auth-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); display: flex; align-items: center; justify-content: center; z-index: 1000; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 15px; margin-bottom: 25px; }
        .card { background: var(--card); border: 1px solid var(--border); padding: 20px; border-radius: 10px; }
        .label { font-size: 0.7rem; color: #8b949e; text-transform: uppercase; font-weight: 600; }
        .value { font-size: 1.6rem; font-weight: bold; color: white; margin-top: 5px; }
        .sub-value { font-size: 0.8rem; margin-top: 5px; opacity: 0.8; }
        .table-container { background: var(--card); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; margin-top: 25px; }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 12px; background: #1c2128; color: #8b949e; font-size: 0.7rem; text-transform: uppercase; cursor: pointer; user-select: none; }
        th:hover { color: var(--accent); }
        td { padding: 12px; border-bottom: 1px solid var(--border); font-family: monospace; }
        .chart-box { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 20px; margin-bottom: 25px; height: 300px; }
        input { width: 320px; padding: 12px; background: #0d1117; border: 1px solid var(--border); color: white; border-radius: 6px; }
        button { background: var(--accent); color: white; border: none; padding: 12px 24px; border-radius: 6px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

<div id="auth-overlay"><div style="text-align:center"><h2>NGU TECH</h2><input type="text" id="wallet-input" placeholder="BTC Address"><br><br><button onclick="login()">Enter Dashboard</button></div></div>

<div class="container">
    <div class="grid">
        <div class="card">
            <div class="label">Total Hashrate</div>
            <div id="t_hr" class="value">0.00 PH/s</div>
            <div id="t_miners" class="sub-value" style="color:var(--accent)">0 Active Miners</div>
        </div>
        <div class="card">
            <div class="label">Pool Luck</div>
            <div id="t_luck" class="value">--%</div>
            <div id="t_blocks" class="sub-value" style="color:var(--warn)">Loading Window...</div>
        </div>
        <div class="card">
            <div class="label">Unpaid Balance</div>
            <div id="t_unpaid" class="value">0.0000 BTC</div>
            <div id="t_usd" class="sub-value" style="color:var(--ok)">$0.00 USD</div>
        </div>
        <div class="card">
            <div class="label">Est. Next Payout</div>
            <div id="t_est" class="value">0.0000 BTC</div>
            <div id="t_shares" class="sub-value">0.0G TIDES Shares</div>
        </div>
    </div>

    <div class="chart-box"><canvas id="hashrateChart"></canvas></div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th onclick="setSort('name')">Miner Name ↕</th>
                    <th onclick="setSort('h5')">5m (TH/s) ↕</th>
                    <th onclick="setSort('h3')">3h (TH/s) ↕</th>
                    <th onclick="setSort('h24')">24h (TH/s) ↕</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="worker-table"></tbody>
        </table>
    </div>
</div>

<script>
    let WALLET = localStorage.getItem('ocean_wallet');
    const PROXY = 'https://api.allorigins.win/raw?url=';
    let chart;
    let currentSort = { key: 'name', asc: true };
    let lastData = [];

    function login() { const v = document.getElementById('wallet-input').value.trim(); if(v) { localStorage.setItem('ocean_wallet', v); location.reload(); } }

    function setSort(key) {
        if (currentSort.key === key) currentSort.asc = !currentSort.asc;
        else { currentSort.key = key; currentSort.asc = true; }
        renderTable();
    }

    function renderTable() {
        const sorted = [...lastData].sort((a, b) => {
            let valA = a[currentSort.key], valB = b[currentSort.key];
            return currentSort.asc ? (valA > valB ? 1 : -1) : (valA < valB ? 1 : -1);
        });
        
        let rows = "";
        sorted.forEach(m => {
            rows += `<tr><td><b>${m.name}</b></td><td>${m.h5.toFixed(2)}</td><td>${m.h3.toFixed(2)}</td><td>${m.h24.toFixed(2)}</td><td style="color:var(--ok)">ONLINE</td></tr>`;
        });
        document.getElementById('worker-table').innerHTML = rows;
    }

    async function update() {
        if (!WALLET) return;
        document.getElementById('auth-overlay').style.display = 'none';

        try {
            const priceRes = await fetch("https://api.coinbase.com/v2/prices/BTC-USD/spot");
            const price = parseFloat((await priceRes.json()).data.amount);

            // Fetching specifically from ocean.xyz pool stats for block window
            const [hrRes, userRes, poolRes] = await Promise.all([
                fetch(PROXY + encodeURIComponent(`https://api.ocean.xyz/v1/user_hashrate_full/${WALLET}`)),
                fetch(PROXY + encodeURIComponent(`https://api.ocean.xyz/v1/statsnap/${WALLET}`)),
                fetch(PROXY + encodeURIComponent(`https://api.ocean.xyz/v1/poolstats`))
            ]);

            const hrData = await hrRes.json();
            const userData = await userRes.json();
            const poolData = await poolRes.json();
            const u = userData.result || userData;

            // 1. Process Worker Data
            const workers = hrData.result?.workers || hrData.workers || {};
            let totalH = 0;
            lastData = Object.keys(workers).map(name => {
                const s = Array.isArray(workers[name]) ? workers[name][0] : workers[name];
                const h5 = parseFloat(s.hashrate_300s || 0);
                totalH += h5;
                return { name, h5: h5/1e12, h3: parseFloat(s.hashrate_10800s||0)/1e12, h24: parseFloat(s.hashrate_86400s||0)/1e12 };
            });
            renderTable();

            // 2. Dash Stats
            const totalPH = (totalH / 1e15).toFixed(2);
            document.getElementById('t_hr').innerText = totalPH + " PH/s";
            document.getElementById('t_miners').innerText = lastData.length + " Active Miners";

            // 3. Pool Luck (Fixing 0 Blocks issue)
            // Use pool_blocks_found_window from poolstats
            const blocks = poolData.pool_blocks_found_window || poolData.result?.pool_blocks_found_window || 0;
            const luck = ((blocks / 8) * 100).toFixed(0);
            document.getElementById('t_luck').innerText = luck + "%";
            document.getElementById('t_blocks').innerText = blocks + " Blocks Found in Window";

            // 4. Payouts
            const unpaid = parseFloat(u.unpaid || 0);
            document.getElementById('t_unpaid').innerText = unpaid.toFixed(8) + " BTC";
            document.getElementById('t_usd').innerText = "$" + (unpaid * price).toLocaleString(undefined, {minimumFractionDigits:2});
            document.getElementById('t_est').innerText = parseFloat(u.estimated_earn_next_block || 0).toFixed(6) + " BTC";
            document.getElementById('t_shares').innerText = (parseFloat(u.shares_in_tides || 0) / 1e9).toFixed(1) + "G TIDES Shares";

            // 5. Graph
            const now = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            chart.data.labels.push(now);
            chart.data.datasets[0].data.push(totalPH);
            if (chart.data.labels.length > 30) { chart.data.labels.shift(); chart.data.datasets[0].data.shift(); }
            chart.update();

        } catch (e) { console.error("API Update Error", e); }
    }

    function initChart() {
        const ctx = document.getElementById('hashrateChart').getContext('2d');
        chart = new Chart(ctx, {
            type: 'line',
            data: { labels: [], datasets: [{ label: 'PH/s', data: [], borderColor: '#58a6ff', tension: 0.3, fill: true, backgroundColor: 'rgba(88,166,255,0.1)', pointRadius: 1 }] },
            options: { responsive: true, maintainAspectRatio: false, scales: { y: { grid: { color: '#30363d' } }, x: { grid: { display: false } } }, plugins: { legend: { display: false } } }
        });
    }

    if (WALLET) { initChart(); update(); setInterval(update, 60000); }
</script>
</body>
</html>
