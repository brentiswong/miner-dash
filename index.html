<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NGU TECH - TIDES Monitor</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --bg: #0d1117; --card: #161b22; --text: #c9d1d9; --accent: #58a6ff; --border: #30363d; --ok: #3fb950; --err: #f85149; --warn: #d29922; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); color: var(--text); padding: 20px; margin: 0; }
        .container { max-width: 1200px; margin: auto; }
        #auth-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); display: flex; align-items: center; justify-content: center; z-index: 1000; }
        .login-card { background: var(--card); padding: 30px; border-radius: 12px; border: 1px solid var(--border); text-align: center; width: 90%; max-width: 400px; }
        input { width: 100%; padding: 12px; margin: 15px 0; background: #0d1117; border: 1px solid var(--border); color: white; border-radius: 6px; box-sizing: border-box; }
        button { background: var(--accent); color: white; border: none; padding: 12px 24px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 15px; margin-bottom: 25px; }
        .card { background: var(--card); border: 1px solid var(--border); padding: 20px; border-radius: 10px; }
        .label { font-size: 0.75rem; color: #8b949e; text-transform: uppercase; font-weight: 600; }
        .value { font-size: 1.6rem; font-weight: bold; color: white; margin-top: 8px; }
        .sub-value { font-size: 0.85rem; color: var(--accent); margin-top: 5px; }
        .chart-container { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 20px; margin-bottom: 25px; height: 400px; }
        .table-container { background: var(--card); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; margin-top: 20px; }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 15px; background: #1c2128; color: #8b949e; font-size: 0.75rem; text-transform: uppercase; cursor: pointer; }
        td { padding: 15px; border-bottom: 1px solid var(--border); font-family: monospace; font-size: 0.9rem; }
        .status-online { color: var(--ok); font-weight: bold; }
        .status-offline { color: var(--err); font-weight: bold; }
        .logout { float: right; color: var(--err); cursor: pointer; font-size: 0.75rem; font-weight: bold; padding: 10px; }
    </style>
</head>
<body>

<div id="auth-overlay"><div class="login-card"><h2>Miner Access</h2><input type="text" id="wallet-input" placeholder="Wallet Address"><button onclick="login()">Launch</button></div></div>

<div class="container">
    <div style="overflow: auto;"><span class="logout" onclick="logout()">LOGOUT & RESET</span></div>
    
    <div class="grid">
        <div class="card">
            <div class="label">Live Hashrate</div>
            <div id="t_hr" class="value">0.00 TH/s</div>
            <div id="t_hr_avg" class="sub-value">Pool: ...</div>
        </div>
        <div class="card">
            <div class="label">Blocks (TIDES Window)</div>
            <div id="t_blocks" class="value">0</div>
            <div id="t_block_status" class="sub-value">Window: ~8x Network Diff</div>
        </div>
        <div class="card">
            <div class="label">Pool Luck</div>
            <div id="t_luck" class="value">0%</div>
            <div id="t_luck_sub" class="sub-value">Rolling Efficiency</div>
        </div>
        <div class="card">
            <div class="label">Unpaid Balance</div>
            <div id="t_unpaid" class="value">0.00 BTC</div>
            <div id="t_usd" class="sub-value" style="color: var(--ok);">$0.00 USD</div>
        </div>
    </div>

    <div class="chart-container"><canvas id="hashrateChart"></canvas></div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th onclick="sortWorkers('name')">Worker ↕</th>
                    <th onclick="sortWorkers('r5')">5m ↕</th>
                    <th onclick="sortWorkers('r3')">3h ↕</th>
                    <th onclick="sortWorkers('r24')">24h ↕</th>
                    <th onclick="sortWorkers('online')">Status ↕</th>
                </tr>
            </thead>
            <tbody id="w-body"></tbody>
        </table>
    </div>
</div>

<script>
    let WALLET = localStorage.getItem('ocean_wallet');
    const PROXY = 'https://api.allorigins.win/raw?url=';
    const OCEAN_API = 'https://api.ocean.xyz/v1';
    let chart, currentWorkers = [], sortKey = 'name', sortAsc = true;

    function formatHashrate(hps) {
        if (!hps || hps <= 0) return { v: 0, u: "TH/s" };
        if (hps >= 1e21) return { v: (hps/1e21).toFixed(2), u: "EH/s" };
        if (hps >= 1e18) return { v: (hps/1e18).toFixed(2), u: "PH/s" };
        return { v: (hps/1e12).toFixed(2), u: "TH/s" };
    }

    function login() { const val = document.getElementById('wallet-input').value.trim(); if(val) { localStorage.setItem('ocean_wallet', val); location.reload(); } }
    function logout() { localStorage.clear(); location.reload(); }

    function initChart() {
        const saved = JSON.parse(localStorage.getItem('miner_history_v13') || '{"labels":[], "h5":[], "h3":[], "h24":[], "u": "TH/s"}');
        const ctx = document.getElementById('hashrateChart').getContext('2d');
        chart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: saved.labels,
                datasets: [
                    { label: '5m Hashrate', data: saved.h5, borderColor: '#58a6ff', backgroundColor: 'rgba(88, 166, 255, 0.1)', fill: true, tension: 0.3 },
                    { label: '3h Hashrate', data: saved.h3, borderColor: '#d29922', fill: false, borderWidth: 2, pointRadius: 0 },
                    { label: '24h Hashrate', data: saved.h24, borderColor: '#3fb950', borderDash: [5, 5], fill: false, borderWidth: 2, pointRadius: 0 }
                ]
            },
            options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { labels: { color: '#8b949e' } } }, scales: { y: { beginAtZero: true, grid: { color: '#30363d' }, title: { display: true, text: 'Hashrate (' + (saved.u || 'TH/s') + ')', color: '#8b949e' }, ticks: { color: '#8b949e' } }, x: { ticks: { color: '#8b949e' }, grid: { display: false } } } }
        });
    }

    function renderWorkers() {
        const sorted = [...currentWorkers].sort((a, b) => {
            let valA = a[sortKey], valB = b[sortKey];
            if (typeof valA === 'string') return sortAsc ? valA.localeCompare(valB) : valB.localeCompare(valA);
            return sortAsc ? valA - valB : valB - valA;
        });
        document.getElementById('w-body').innerHTML = sorted.map(w => `
            <tr><td><b>${w.name}</b></td><td>${(w.r5/1e12).toFixed(2)}</td><td>${(w.r3/1e12).toFixed(2)}</td><td>${(w.r24/1e12).toFixed(2)}</td>
            <td class="${w.online ? 'status-online' : 'status-offline'}">${w.online ? 'ONLINE' : 'OFFLINE'}</td></tr>
        `).join('');
    }

    function sortWorkers(key) {
        if (sortKey === key) sortAsc = !sortAsc;
        else { sortKey = key; sortAsc = true; }
        renderWorkers();
    }

    async function update() {
        if (!WALLET) return;
        document.getElementById('auth-overlay').style.display = 'none';
        try {
            const btcPriceRes = await fetch("https://api.coinbase.com/v2/prices/BTC-USD/spot");
            const btcJson = await btcPriceRes.json();
            const price = parseFloat(btcJson.data.amount) || 0;

            const hrUrl = PROXY + encodeURIComponent(`${OCEAN_API}/user_hashrate_full/${WALLET}`);
            const poolUrl = PROXY + encodeURIComponent(`${OCEAN_API}/statsnap`);
            const userUrl = PROXY + encodeURIComponent(`${OCEAN_API}/statsnap/${WALLET}`);
            
            const [hrRes, poolRes, userRes] = await Promise.all([fetch(hrUrl), fetch(poolUrl), fetch(userUrl)]);
            const hrData = await hrRes.json();
            const poolData = await poolRes.json();
            const userData = await userRes.json();

            // GLOBAL POOL STATS
            const pStats = poolData.result || poolData;
            const uStats = userData.result || userData;

            // CORRECTED TIDES BLOCKS
            // We prioritize 'pool_blocks_found_window' which is the explicit TIDES window metric
            const windowBlocks = pStats.pool_blocks_found_window || pStats.blocks_found || 0;
            document.getElementById('t_blocks').innerText = windowBlocks;
            document.getElementById('t_block_status').innerText = windowBlocks >= 4 ? "Healthy Window" : "Window Filling...";
            
            // LUCK PERCENTAGE
            const luck = (parseFloat(pStats.luck) * 100) || 0;
            document.getElementById('t_luck').innerText = luck.toFixed(1) + "%";
            document.getElementById('t_luck').style.color = luck >= 100 ? 'var(--ok)' : 'var(--warn)';

            // UNPAID BALANCE
            const btcBalance = parseFloat(uStats.unpaid) || 0;
            document.getElementById('t_unpaid').innerText = `${btcBalance.toFixed(8)} BTC`;
            document.getElementById('t_usd').innerText = `$${(btcBalance * price).toLocaleString(undefined, {minimumFractionDigits: 2})} USD`;

            // WORKER TABLE
            const wObj = hrData.result?.workers || hrData.workers || {};
            let t5 = 0, t3 = 0, t24 = 0;
            currentWorkers = Object.keys(wObj).map(name => {
                const s = Array.isArray(wObj[name]) ? wObj[name][0] : wObj[name];
                const r5 = parseFloat(s.hashrate_300s) || 0, r3 = parseFloat(s.hashrate_10800s) || 0, r24 = parseFloat(s.hashrate_86400s) || 0;
                t5 += r5; t3 += r3; t24 += r24;
                return { name, r5, r3, r24, online: r5 > 0 };
            });
            renderWorkers();

            // CHART DATA
            const s5 = formatHashrate(t5), s3 = formatHashrate(t3), s24 = formatHashrate(t24);
            const poolH = formatHashrate(parseFloat(pStats.hashrate_3600s) || 0);
            document.getElementById('t_hr').innerText = s5.v + " " + s5.u;
            document.getElementById('t_hr_avg').innerText = `Pool: ${poolH.v} ${poolH.u}`;

            const now = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            chart.options.scales.y.title.text = 'Hashrate (' + s5.u + ')';
            chart.data.labels.push(now);
            chart.data.datasets[0].data.push(s5.v);
            chart.data.datasets[1].data.push(s3.v);
            chart.data.datasets[2].data.push(s24.v);
            if (chart.data.labels.length > 288) { chart.data.labels.shift(); chart.data.datasets.forEach(d => d.data.shift()); }
            chart.update();
            
            localStorage.setItem('miner_history_v13', JSON.stringify({ labels: chart.data.labels, h5: chart.data.datasets[0].data, h3: chart.data.datasets[1].data, h24: chart.data.datasets[2].data, u: s5.u }));
        } catch (e) { console.error("Update Error:", e); }
    }

    if (WALLET) { initChart(); update(); setInterval(update, 300000); }
</script>
</body>
</html>
