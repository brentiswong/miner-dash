<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NGU TECH - BTC Deep History</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --bg: #0d1117; --card: #161b22; --text: #c9d1d9; --accent: #58a6ff; --worker-line: #ff7b72; --border: #30363d; --ok: #3fb950; --dead: #f85149; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); color: var(--text); padding: 15px; margin: 0; }
        .container { max-width: 1200px; margin: auto; }
        #auth-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); display: flex; align-items: center; justify-content: center; z-index: 1000; }
        .pool-status { background: #1c2128; border: 1px solid var(--border); border-radius: 8px; padding: 12px 18px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; }
        .pool-label { color: #8b949e; text-transform: uppercase; font-size: 0.65rem; font-weight: 700; margin-right: 5px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .card { background: var(--card); border: 1px solid var(--border); padding: 18px; border-radius: 8px; }
        .value { font-size: 1.5rem; font-weight: 800; color: white; margin-top: 5px; }
        .chart-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        @media (max-width: 900px) { .chart-grid { grid-template-columns: 1fr; } }
        .chart-box { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 15px; height: 300px; }
        .table-container { background: var(--card); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; margin-bottom: 25px; }
        table { width: 100%; border-collapse: collapse; font-family: monospace; font-size: 0.85rem; }
        th { text-align: left; padding: 12px; background: #1c2128; color: #8b949e; font-size: 0.7rem; text-transform: uppercase; cursor: pointer; }
        td { padding: 12px; border-bottom: 1px solid var(--border); }
        h3 { font-size: 0.85rem; color: var(--accent); padding: 15px; margin: 0; background: #1c2128; border-bottom: 1px solid var(--border); text-transform: uppercase; }
        input { width: 340px; padding: 12px; background: #0d1117; border: 1px solid var(--border); color: white; border-radius: 4px; }
        button { background: var(--accent); color: white; border: none; padding: 12px 24px; border-radius: 4px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

<div id="auth-overlay"><div style="text-align:center"><h2>NGU TECH Dashboard</h2><input type="text" id="wallet-input" placeholder="Enter BTC Address"><br><br><button onclick="login()">Sync Dashboard</button></div></div>

<div class="container">
    <div class="pool-status">
        <div><span class="pool-label">Pool HR:</span> <span id="pool-hr-global" style="color:var(--accent); font-weight:bold">...</span></div>
        <div><span class="pool-label">Last Block:</span> <span id="pool-height" style="color:var(--accent); font-weight:bold">...</span></div>
        <div id="pool-time" style="color:#8b949e">Loading...</div>
    </div>

    <div class="grid">
        <div class="card"><div class="pool-label">Unpaid (BTC)</div><div id="t_unpaid" class="value">0.00000000</div></div>
        <div class="card"><div class="pool-label">User Hashrate (5m)</div><div id="t_hr" class="value">0.00 PH/s</div></div>
        <div class="card"><div class="pool-label">Est. Next Block</div><div id="t_est" class="value">0.00000000</div></div>
    </div>

    <div class="chart-grid">
        <div class="chart-box">
            <h3 style="background:transparent; padding:0 0 10px 0">Historical Hashrate (Deep Scan)</h3>
            <canvas id="histChart"></canvas>
        </div>
        <div class="chart-box">
            <h3 style="background:transparent; padding:0 0 10px 0">24H Live Performance</h3>
            <canvas id="liveChart"></canvas>
        </div>
    </div>

    <div class="table-container">
        <h3>Miner Status</h3>
        <table>
            <thead>
                <tr>
                    <th onclick="setSort('name')">Name ↕</th>
                    <th onclick="setSort('h5')">5m (TH/s) ↕</th>
                    <th onclick="setSort('h24')">24h (TH/s) ↕</th>
                    <th onclick="setSort('status')">Status ↕</th>
                </tr>
            </thead>
            <tbody id="worker-table"></tbody>
        </table>
    </div>
</div>

<script>
    let WALLET = localStorage.getItem('ocean_wallet');
    const PROXY = 'https://api.allorigins.win/raw?url=';
    let histChart, liveChart;
    let currentSort = { key: 'name', asc: true };
    let lastWorkers = [];

    function login() { 
        const v = document.getElementById('wallet-input').value.trim(); 
        if(v) { localStorage.setItem('ocean_wallet', v); location.reload(); } 
    }

    function setSort(k) {
        if (currentSort.key === k) currentSort.asc = !currentSort.asc;
        else { currentSort.key = k; currentSort.asc = true; }
        renderWorkers();
    }

    function renderWorkers() {
        const sorted = [...lastWorkers].sort((a,b) => currentSort.asc ? (a[currentSort.key] > b[currentSort.key] ? 1 : -1) : (a[currentSort.key] < b[currentSort.key] ? 1 : -1));
        document.getElementById('worker-table').innerHTML = sorted.map(m => `
            <tr><td><b>${m.name}</b></td><td>${m.h5.toFixed(2)}</td><td>${m.h24.toFixed(2)}</td>
            <td style="color:${m.status==='ACTIVE'?'var(--ok)':'var(--dead)'}">● ${m.status}</td></tr>`).join('');
    }

    async function update() {
        if (!WALLET) return;
        document.getElementById('auth-overlay').style.display = 'none';

        try {
            const [hrRes, uRes, poolRes, poolHrRes] = await Promise.all([
                fetch(PROXY + encodeURIComponent(`https://api.ocean.xyz/v1/user_hashrate_full/${WALLET}`)),
                fetch(PROXY + encodeURIComponent(`https://api.ocean.xyz/v1/statsnap/${WALLET}`)),
                fetch(PROXY + encodeURIComponent(`https://api.ocean.xyz/v1/latest_block`)),
                fetch(PROXY + encodeURIComponent(`https://api.ocean.xyz/v1/pool_hashrate`))
            ]);

            const hrData = await hrRes.json();
            const u = (await uRes.json()).result || {};
            const poolData = await poolRes.json();
            const pHR = await poolHrRes.json();

            // Stats
            document.getElementById('pool-height').innerText = "#" + (poolData.result?.blocks?.[0]?.height || "...");
            document.getElementById('pool-hr-global').innerText = (parseFloat(pHR.result?.pool_300s||0)/1e18).toFixed(2) + " EH/s";
            document.getElementById('t_unpaid').innerText = parseFloat(u.unpaid||0).toFixed(8);
            document.getElementById('t_est').innerText = parseFloat(u.estimated_earn_next_block||0).toFixed(8);

            // Workers
            let total5 = 0;
            const ws = hrData.result?.workers || hrData.workers || {};
            lastWorkers = Object.keys(ws).map(name => {
                const s = Array.isArray(ws[name]) ? ws[name][0] : ws[name];
                const h5 = parseFloat(s.hashrate_300s||0);
                total5 += h5;
                return { name, h5: h5/1e12, h24: (s.hashrate_86400s||0)/1e12, status: h5 > 0 ? 'ACTIVE' : 'INACTIVE' };
            });
            renderWorkers();
            document.getElementById('t_hr').innerText = (total5/1e15).toFixed(2) + " PH/s";

            // Live Chart
            const ts = new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
            liveChart.data.labels.push(ts);
            liveChart.data.datasets[0].data.push((total5/1e15).toFixed(2));
            if(liveChart.data.labels.length > 1440) { liveChart.data.labels.shift(); liveChart.data.datasets[0].data.shift(); }
            liveChart.update();
            localStorage.setItem('live_24h', JSON.stringify({labels: liveChart.data.labels, hr: liveChart.data.datasets[0].data}));

        } catch (e) { console.error(e); }
    }

    async function init() {
        // Hist Line Chart
        const histCtx = document.getElementById('histChart').getContext('2d');
        histChart = new Chart(histCtx, {
            type: 'line',
            data: { labels: [], datasets: [{ label: 'PH/s', data: [], borderColor: '#58a6ff', tension: 0.3, fill: true, backgroundColor: 'rgba(88,166,255,0.1)' }] },
            options: { responsive: true, maintainAspectRatio: false, scales: { y: { grid: { color: '#30363d' } } } }
        });

        // Pull 2024 Context (Example: Oct-Dec 2024)
        const years = ["2024-10", "2024-11", "2024-12", ""];
        let combinedLabels = [], combinedData = [];
        for (const y of years) {
            try {
                const url = `https://api.ocean.xyz/v1/monthly_user_report/${WALLET}${y ? '/' + y : ''}`;
                const res = await fetch(PROXY + encodeURIComponent(url));
                const d = await res.json();
                (d.result?.report || []).forEach(day => {
                    if (parseFloat(day.hashrate_avg_24hr_thsec) > 0) {
                        combinedLabels.push(day.date);
                        combinedData.push((parseFloat(day.hashrate_avg_24hr_thsec)/1000).toFixed(2));
                    }
                });
            } catch(e){}
        }
        histChart.data.labels = combinedLabels;
        histChart.data.datasets[0].data = combinedData;
        histChart.update();

        // Live Chart
        const liveCtx = document.getElementById('liveChart').getContext('2d');
        const saved = JSON.parse(localStorage.getItem('live_24h') || '{"labels":[], "hr":[]}');
        liveChart = new Chart(liveCtx, {
            type: 'line',
            data: { labels: saved.labels, datasets: [{ label: 'Live PH/s', data: saved.hr, borderColor: '#58a6ff', pointRadius: 0, tension: 0.1 }] },
            options: { responsive: true, maintainAspectRatio: false, scales: { y: { grid: { color: '#30363d' } } } }
        });

        update(); setInterval(update, 60000);
    }
    if (WALLET) init();
</script>
</body>
</html>
