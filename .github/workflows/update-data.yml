name: Update Live Data

permissions:
  contents: write   # This explicitly allows push

on:
  schedule:
    - cron: '* * * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4   # No token needed

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install node-fetch

      - name: Run update script
        env:
          WALLET: ${{ secrets.WALLET }}
        run: node update-live-data.js

      - name: Commit and push changes
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'
          git add live_data.json
          git commit -m 'Update live performance data' --allow-empty || echo "No changes to commit"
          git push
