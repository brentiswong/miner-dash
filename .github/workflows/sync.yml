- name: Fetch 2-Year Ocean Data
        run: |
          WALLET="bc1q76zgkz5ussy2hl54vdz7nv0q96kta82ckdu7ys"
          echo '{"result": {"report": []}}' > history.json
          for i in {0..23}; do
            TARGET_DATE=$(date -d "$i month ago" +%Y-%m)
            echo "Fetching $TARGET_DATE..."
            curl -s "https://api.ocean.xyz/v1/monthly_user_report/$WALLET/$TARGET_DATE" > temp.json
            # Flattened python command to avoid IndentationErrors
            python3 -c "import json; m=json.load(open('history.json')); n=json.load(open('temp.json')); m['result']['report'].extend(n.get('result', {}).get('report', [])) if 'result' in n else None; json.dump(m, open('history.json', 'w'))"
          done
